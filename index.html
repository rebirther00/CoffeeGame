<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선 넘지 마 커피</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFD02E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위는 무대(주전자와 종이컵), 아래는 엄지로 누르는 조작 패널. 한 화면에 고정한다. */
:root {
  --bg: #FFD02E;
  --fg: #2A1509;
  --muted: #6A4A12;
  --surface: #FFF7E0;
  --surface-fg: #2A1509;
  --line: #2A1509;
  --shadow: #2A1509;
  --primary: #2A1509;
  --primary-fg: #FFE07A;
  --danger: #D7301B;
  --danger-fg: #FFFFFF;
  --danger-text: #BD2410;
  --good: #1E7F50;
  --focus: #1B46D1;
  --stage: #FFE789;
  --table: #F0AE1A;
  /* 무대 그림 색 */
  --ink: #2A1509;
  --cup: #FFFFFF;
  --cup-in: #F1E7D3;
  --coffee: #57300F;
  --crema: #C8904C;
  --kettle: #D7301B;
  --kettle-dk: #A9200E;
  --sleeve: #CBA063;
  --dash: #FFD02E;
  --stove: #4B352A;
  --flame: #FF7A1A;
  --p1: #D7301B;
  --p2: #1E63B8;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #20130B;
    --fg: #FCEFD3;
    --muted: #CDB48A;
    --surface: #36210F;
    --surface-fg: #FCEFD3;
    --line: #0B0503;
    --shadow: #0B0503;
    --primary: #FFD02E;
    --primary-fg: #2A1509;
    --danger: #E4442E;
    --danger-fg: #FFFFFF;
    --danger-text: #FF8A73;
    --good: #2FA36B;
    --focus: #9CB8FF;
    --stage: #F6C62C;
    --table: #D9990F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #20130B;
  --fg: #FCEFD3;
  --muted: #CDB48A;
  --surface: #36210F;
  --surface-fg: #FCEFD3;
  --line: #0B0503;
  --shadow: #0B0503;
  --primary: #FFD02E;
  --primary-fg: #2A1509;
  --danger: #E4442E;
  --danger-fg: #FFFFFF;
  --danger-text: #FF8A73;
  --good: #2FA36B;
  --focus: #9CB8FF;
  --stage: #F6C62C;
  --table: #D9990F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 500 15px/1.45 var(--font-body);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: manipulation;
}
#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
p, h1, h2, ol, ul { margin: 0; padding: 0; }
ol, ul { list-style: none; }

/* 공통 버튼 */
.btn {
  appearance: none;
  border: 2.5px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  color: var(--surface-fg);
  font: 700 16px/1.2 var(--font-body);
  padding: 12px 16px;
  box-shadow: 0 4px 0 var(--shadow);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .06s, box-shadow .06s, opacity .15s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.btn:focus-visible, .link:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.btn[disabled] { opacity: .5; }
.btn.primary { background: var(--primary); color: var(--primary-fg); }
.btn.big { width: 100%; font: 400 24px/1.15 var(--font-display); padding: 15px 18px; letter-spacing: .01em; }
.link {
  appearance: none; border: 0; background: none; color: var(--muted);
  font: 500 13px/1.2 var(--font-body); padding: 6px 2px; text-decoration: underline; cursor: pointer;
}
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }

/* 무대 */
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  border: 2.5px solid var(--line);
  border-radius: 22px;
  background: var(--stage);
  box-shadow: 0 4px 0 var(--shadow);
  overflow: hidden;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* 설정 화면 */
#setup { overflow-y: auto; gap: 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
.brand h1 {
  align-self: flex-start;
  font: 400 46px/1.1 var(--font-display);
  padding-bottom: 6px;
  border-bottom: 5px dashed var(--danger);
}
.games { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-bottom: 4px; }
.game { position: relative; cursor: pointer; min-width: 0; }
.game input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.game span {
  display: flex; flex-direction: column; gap: 1px; height: 100%;
  border: 2.5px solid var(--line); border-radius: 16px; padding: 8px 10px 9px;
  background: var(--surface); color: var(--surface-fg); box-shadow: 0 4px 0 var(--shadow);
  transition: transform .06s, box-shadow .06s;
}
.game small { font-size: 12.5px; font-weight: 700; opacity: .75; white-space: nowrap; }
.game b { font: 400 19px/1.15 var(--font-display); }
.game input:checked + span { background: var(--primary); color: var(--primary-fg); transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }
.game input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }
.stage.hero { flex: 0 0 auto; height: 190px; height: clamp(160px, 27vh, 230px); }
.rules { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.rules li { padding-left: 18px; position: relative; }
.rules li::before { content: ""; position: absolute; left: 0; top: .7em; width: 11px; border-top: 2.5px dashed var(--danger); }
.opts {
  display: flex; flex-direction: column; gap: 6px;
  background: var(--surface); color: var(--surface-fg);
  border: 2.5px solid var(--line); border-radius: 20px;
  padding: 10px 14px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.row + .row, .names + .row { border-top: 1.5px dashed color-mix(in srgb, var(--surface-fg) 28%, transparent); }
.label { font-weight: 700; display: flex; flex-direction: column; min-width: 0; }
.label small { font-weight: 400; font-size: 12.5px; opacity: .75; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button {
  appearance: none; width: 42px; height: 42px; border-radius: 50%;
  border: 2.5px solid var(--line); background: var(--bg); color: var(--fg);
  font: 700 22px/1 var(--font-body); cursor: pointer; box-shadow: 0 3px 0 var(--shadow);
}
.stepper button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.stepper button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.stepper output { min-width: 3.2em; text-align: center; font: 400 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 0 10px; }
.name {
  display: flex; align-items: center; gap: 6px; min-width: 0;
  border: 2px solid var(--line); border-radius: 12px; padding: 0 8px 0 10px;
  background: color-mix(in srgb, var(--surface) 70%, var(--bg));
}
.name span { font: 400 16px/1 var(--font-display); opacity: .6; }
.name input {
  flex: 1 1 auto; min-width: 0; width: 100%; height: 40px; border: 0; background: transparent; color: inherit;
  font: 500 16px/1 var(--font-body); -webkit-user-select: text; user-select: text; outline: none;
}
.name:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.seg { flex: 0 0 auto; display: flex; border: 2.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 8px 14px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg label + label span { border-left: 2.5px solid var(--line); }
.seg input:checked + span { background: var(--primary); color: var(--primary-fg); }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: -4px; }
.toggle { cursor: pointer; position: relative; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle i {
  flex: 0 0 auto; position: relative; width: 54px; height: 31px;
  border: 2.5px solid var(--line); border-radius: 999px;
  background: color-mix(in srgb, var(--surface-fg) 16%, var(--surface));
  transition: background .15s;
}
.toggle i::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface-fg); transition: transform .15s;
}
.toggle input:checked + i { background: var(--good); }
.toggle input:checked + i::after { transform: translateX(23px); background: #FFFFFF; }
.toggle input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }
.start { position: sticky; bottom: 0; padding: 8px 0 8px; margin-top: 4px; background: var(--bg); }

/* 게임 화면 */
.hud { display: flex; flex-direction: column; gap: 6px; }
.hud-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#hud-round { font: 400 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; display: flex; gap: 6px; align-items: baseline;
  border: 2px solid var(--line); border-radius: 999px; padding: 3px 11px;
  background: var(--surface); color: var(--surface-fg); font-size: 13px; font-weight: 700;
}
.chip b { font-weight: 500; font-variant-numeric: tabular-nums; }
.chip.over b { color: var(--danger-text); font-weight: 700; }
.chip.todo { background: transparent; color: var(--muted); border-style: dashed; border-color: var(--muted); }
.chip.now { background: var(--primary); color: var(--primary-fg); }
.count {
  position: absolute; left: 20px; top: 8px;
  font: 400 104px/1 var(--font-display); color: var(--ink); pointer-events: none;
}
.count.word { font-size: 68px; top: 14px; left: 16px; }
.count.pop { animation: pop .5s ease-out both; }
.stamp {
  position: absolute; left: 14px; top: 16px; transform: rotate(-7deg);
  font: 400 30px/1.1 var(--font-display); padding: 6px 14px 4px;
  border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink);
  background: var(--cup); color: var(--kettle); pointer-events: none;
  animation: stamp .28s cubic-bezier(.2, 1.6, .4, 1) both;
}
.stamp.good { background: var(--ink); color: var(--dash); }
@keyframes pop { from { transform: scale(1.5); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
@keyframes stamp { from { transform: rotate(-7deg) scale(2.2); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: 1; } }
.panel { flex: 0 0 auto; height: 176px; }
.pane { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding-bottom: 5px; }
.who { font: 400 34px/1.1 var(--font-display); overflow-wrap: anywhere; }
.who small { font: 400 22px/1 var(--font-display); opacity: .7; }
.hint { font-size: 14px; color: var(--muted); }
.btn.stop {
  width: 100%; height: calc(100% - 9px);
  border-radius: 26px; border-width: 3px;
  background: var(--danger); color: var(--danger-fg);
  font: 400 62px/1 var(--font-display);
  box-shadow: 0 8px 0 var(--shadow);
  touch-action: none;
}
.btn.stop:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--shadow); }
.btn.stop.wait { background: color-mix(in srgb, var(--danger) 45%, var(--bg)); font-size: 34px; }
.verdict { font: 400 30px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.verdict.bad { color: var(--danger-text); }
.detail { font-size: 14.5px; font-variant-numeric: tabular-nums; }

/* 맞대결 화면: 위아래 조종판 사이에 경기장. 위쪽 조종판은 마주 앉은 사람이 읽도록 뒤집는다. */
#duel { gap: 10px; }
.pad {
  flex: 0 0 auto; height: 92px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-content: center; gap: 4px 10px;
  padding: 8px 16px;
  border: 2.5px solid var(--line); border-radius: 20px;
  background: var(--surface);
  background: color-mix(in srgb, var(--pc) 18%, var(--surface));
  color: var(--surface-fg);
  box-shadow: 0 4px 0 var(--shadow);
  touch-action: none; cursor: grab;
}
.pad.top { --pc: var(--p1); transform: rotate(180deg); box-shadow: 0 -4px 0 var(--shadow); }
.pad.bot { --pc: var(--p2); }
.pad.ready { background: color-mix(in srgb, var(--pc) 42%, var(--surface)); }
.pad.hit { animation: padhit .35s ease-out; }
@keyframes padhit { from { background: var(--pc); } }
.pname { font: 400 24px/1.15 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lives { display: flex; gap: 6px; align-items: center; }
.life { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); background: var(--pc); }
.life.off { background: transparent; opacity: .4; }
.phint { grid-column: 1 / -1; font-size: 13.5px; opacity: .8; }
.pad.done .phint { font: 400 21px/1.1 var(--font-display); opacity: 1; }
.dmsg {
  position: absolute; left: 0; right: 0; text-align: center;
  font: 400 60px/1 var(--font-display); color: var(--ink); text-shadow: 0 3px 0 var(--cup); pointer-events: none;
}
.dmsg.top { top: 17%; transform: rotate(180deg); }
.dmsg.bot { bottom: 17%; }
.dcard {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(88%, 300px);
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  padding: 14px 14px 8px;
  background: var(--surface); color: var(--surface-fg);
  border: 2.5px solid var(--line); border-radius: 18px; box-shadow: 0 5px 0 var(--shadow);
}
.dcard h3 { margin: 0; font: 400 26px/1.15 var(--font-display); overflow-wrap: anywhere; }
.dcard p { font-size: 14px; }
.dcard .btn { margin-top: 4px; }

/* 결과 화면 */
#result { overflow-y: auto; }
.res-head { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.res-head h2 { font: 400 34px/1.15 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; }
.loser {
  align-self: flex-start; display: flex; flex-direction: column; gap: 2px; max-width: 100%;
  background: var(--danger); color: var(--danger-fg);
  border: 2.5px solid var(--line); border-radius: 18px; box-shadow: 0 5px 0 var(--shadow);
  padding: 10px 18px 12px; transform: rotate(-1.5deg); margin: 6px 0 4px;
}
.loser .tag { font-size: 13px; font-weight: 700; letter-spacing: .12em; }
.loser strong { font: 400 44px/1.1 var(--font-display); overflow-wrap: anywhere; }
.loser .why { font-size: 14px; }
.rank { display: flex; flex-direction: column; gap: 8px; }
.rk {
  display: grid; grid-template-columns: 34px auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  background: var(--surface); color: var(--surface-fg);
  border: 2.5px solid var(--line); border-radius: 16px; padding: 8px 14px 8px 10px;
}
.rk.nocup { grid-template-columns: 34px minmax(0, 1fr) auto; }
.rk .pos {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid var(--line); font: 400 18px/1 var(--font-display); padding-top: 2px;
  background: color-mix(in srgb, var(--surface-fg) 10%, var(--surface));
}
.rk.first .pos { background: var(--dash); color: var(--ink); }
.rk.last { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger); }
.rk.last .pos { background: var(--danger); color: var(--danger-fg); }
.mini { width: 36px; height: 40px; display: block; }
.rk .who2 { min-width: 0; display: flex; flex-direction: column; }
.rk .nm { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.rk .sub { font-size: 12.5px; opacity: .78; font-variant-numeric: tabular-nums; }
.rk .sub.bad { color: var(--danger-text); opacity: 1; font-weight: 700; }
.rk .val { text-align: right; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; }
.rk .val b { font: 400 22px/1.1 var(--font-display); }
.rk .val small { font-size: 12px; opacity: .78; }
.actions { margin-top: auto; position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 8px 0 8px; background: var(--bg); }
.actions .btn:not(.big) { width: 100%; }

@media (max-height: 620px) {
  .panel { height: 150px; }
  .btn.stop { font-size: 50px; }
  .who { font-size: 28px; }
  .brand h1 { font-size: 38px; }
  .pad { height: 80px; }
  .dmsg { font-size: 48px; }
}
@media (prefers-reduced-motion: reduce) {
  .count.pop, .stamp { animation: none; }
  .btn, .toggle i, .toggle i::after, .game span { transition: none; }
  .pad.hit { animation: none; }
}
</style>
</head>
<body>
<div id="app">

  <!-- 설정 -->
  <section id="setup" class="screen">
    <header class="brand">
      <p class="eyebrow">폰 하나로 하는 커피 내기</p>
      <h1 id="game-title">선 넘지 마!</h1>
    </header>
    <div class="games" role="radiogroup" aria-label="게임 선택">
      <label class="game"><input type="radio" name="game" id="game-pour" value="pour"><span><small>타이밍</small><b>커피<br>따르기</b></span></label>
      <label class="game"><input type="radio" name="game" id="game-react" value="react"><span><small>반응속도</small><b>주전자<br>끓이기</b></span></label>
      <label class="game"><input type="radio" name="game" id="game-duel" value="duel"><span><small>2인 대결</small><b>비행기<br>맞대결</b></span></label>
    </div>
    <div class="stage hero"><canvas id="hero" aria-hidden="true"></canvas></div>
    <ul class="rules" id="rules"></ul>
    <form id="form" autocomplete="off">
      <div class="opts">
        <div class="row">
          <span class="label" id="lb-n">인원</span>
          <div class="stepper" role="group" aria-labelledby="lb-n">
            <button type="button" id="n-dec" aria-label="인원 줄이기">−</button>
            <output id="n-out" aria-live="polite">3명</output>
            <button type="button" id="n-inc" aria-label="인원 늘리기">+</button>
          </div>
        </div>
        <div id="names" class="names"></div>
        <div class="row no-duel">
          <span class="label" id="lb-r">판 수<small>여러 판이면 순위 점수를 합산합니다</small></span>
          <div class="seg" role="radiogroup" aria-labelledby="lb-r">
            <label><input type="radio" name="rounds" id="rounds-1" value="1"><span>1판</span></label>
            <label><input type="radio" name="rounds" id="rounds-3" value="3"><span>3판</span></label>
            <label><input type="radio" name="rounds" id="rounds-5" value="5"><span>5판</span></label>
          </div>
        </div>
        <label class="row toggle only-pour" for="opt-irr">
          <span class="label">속도 불규칙<small>커피 줄기가 빨라졌다 느려집니다</small></span>
          <input type="checkbox" id="opt-irr"><i></i>
        </label>
        <label class="row toggle only-pour" for="opt-blind">
          <span class="label">블라인드 구간<small>목표선 근처 수위를 컵홀더로 가립니다</small></span>
          <input type="checkbox" id="opt-blind"><i></i>
        </label>
        <label class="row toggle" for="opt-sfx">
          <span class="label">효과음·진동</span>
          <input type="checkbox" id="opt-sfx"><i></i>
        </label>
      </div>
      <div class="start"><button type="submit" class="btn primary big" id="btn-start">게임 시작</button></div>
    </form>
  </section>

  <!-- 게임 -->
  <section id="play" class="screen" hidden>
    <header class="hud">
      <div class="hud-top">
        <span id="hud-round">1판</span>
        <button type="button" class="link" id="btn-quit">그만하기</button>
