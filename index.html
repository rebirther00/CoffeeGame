<script>
(() => {
'use strict';
document.documentElement.lang = 'ko';

/* ───────── 유틸 ───────── */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rand = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const mm = x => (Math.round(Math.abs(x) * 10) / 10).toFixed(1);
const overMm = x => (Math.abs(x) < 0.1 ? '0.1' : mm(x));
const sec = ms => (ms / 1000).toFixed(3);

/* 순위: key가 작을수록 위. 같은 key는 같은 등수. */
function assignRanks(sorted, same) {
  let rank = 1;
  sorted.forEach((r, i) => {
    if (i > 0 && !same(sorted[i - 1], r)) rank = i + 1;
    r.rank = rank;
  });
  return sorted;
}
function rankRound(results) {
  const s = results.map(r => ({ ...r })).sort((a, b) => a.key - b.key);
  return assignRanks(s, (a, b) => Math.abs(a.key - b.key) < 1e-7);
}

/* ───────── 소리·진동 ───────── */
const SFX = {
  on: true, ac: null, noise: null, pour: null,
  init() {
    if (!this.on) return null;
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ac = new AC();
      }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) { this.ac = null; }
    return this.ac;
  },
  tone(freq, dur, o) {
    const ac = this.init();
    if (!ac) return;
    o = o || {};
    try {
      const t = ac.currentTime + (o.at || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.18, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t); osc.stop(t + dur + 0.04);
    } catch (e) {}
  },
  pourStart() {
    const ac = this.init();
    if (!ac || this.pour) return;
    try {
      if (!this.noise) {
        const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = b.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        this.noise = b;
      }
      const src = ac.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 360; bp.Q.value = 1.1;
      const g = ac.createGain();
      g.gain.value = 0.0001;
      src.connect(bp); bp.connect(g); g.connect(ac.destination);
      src.start();
      g.gain.setTargetAtTime(0.2, ac.currentTime, 0.04);
      this.pour = { src, bp, g };
    } catch (e) { this.pour = null; }
  },
  // 컵이 찰수록 소리가 높아진다. 블라인드 구간에서는 이 소리가 유일한 단서다.
  pourSet(h, m) {
    const p = this.pour;
    if (!p) return;
    try {
      const t = this.ac.currentTime;
      p.bp.frequency.setTargetAtTime(360 + 500 * h + 1500 * h * h, t, 0.05);
      p.g.gain.setTargetAtTime(0.09 + 0.14 * m, t, 0.05);
    } catch (e) {}
  },
  pourStop() {
    const p = this.pour;
    if (!p) return;
    this.pour = null;
    try {
      const t = this.ac.currentTime;
      p.g.gain.cancelScheduledValues(t);
      p.g.gain.setTargetAtTime(0.0001, t, 0.02);
      p.src.stop(t + 0.2);
    } catch (e) {}
  },
  // 물 끓는 소리. 신호 시점을 알려 주지 않도록 크기와 높이를 고정한다.
  simmer() {
    this.pourStart();
    const p = this.pour;
    if (!p) return;
    try {
      const t = this.ac.currentTime;
      p.bp.frequency.setValueAtTime(230, t);
      p.g.gain.cancelScheduledValues(t);
      p.g.gain.setTargetAtTime(0.07, t, 0.1);
    } catch (e) {}
  },
  whistle() {
    this.tone(2050, 0.55, { to: 2500, vol: 0.14 });
    this.tone(3075, 0.55, { to: 3750, vol: 0.05 });
    this.buzz(45);
  },
  shot() {
    const ac = this.ac;
    if (!ac || !this.on || ac.currentTime - (this.lastShot || 0) < 0.12) return;
    this.lastShot = ac.currentTime;
    this.tone(900, 0.05, { type: 'square', vol: 0.025, to: 500 });
  },
  boom() { this.tone(170, 0.4, { type: 'sawtooth', vol: 0.2, to: 45 }); this.buzz(90); },
  buzz(pattern) {
    if (!this.on) return;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  },
  click() { this.tone(1500, 0.05, { type: 'square', vol: 0.08 }); this.buzz(18); },
  perfect() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.22, { at: i * 0.09, type: 'triangle', vol: 0.2 })); this.buzz([15, 40, 15, 40, 30]); },
  close() { this.tone(660, 0.16, { type: 'triangle' }); this.tone(880, 0.26, { at: 0.13, type: 'triangle' }); },
  ok() { this.tone(520, 0.2, { type: 'triangle', vol: 0.14 }); },
  meh() { this.tone(330, 0.22, { type: 'triangle', vol: 0.14, to: 260 }); },
  over() { this.tone(300, 0.5, { type: 'sawtooth', vol: 0.14, to: 110 }); this.buzz([90, 50, 140]); },
  flood() { this.tone(260, 0.8, { type: 'sawtooth', vol: 0.16, to: 70 }); this.buzz([120, 60, 120, 60, 260]); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i === 3 ? 0.5 : 0.16, { at: i * 0.14, type: 'triangle', vol: 0.2 })); }
};

/* ───────── 그림 공통 ───────── */
const COL = {};
let FONT_BODY = 'sans-serif', FONT_DISPLAY = 'sans-serif';
function readTokens() {
  const cs = getComputedStyle(document.documentElement);
  const g = n => cs.getPropertyValue(n).trim();
  COL.ink = g('--ink'); COL.cup = g('--cup'); COL.cupIn = g('--cup-in');
  COL.coffee = g('--coffee'); COL.crema = g('--crema');
  COL.kettle = g('--kettle'); COL.kettleDk = g('--kettle-dk');
  COL.sleeve = g('--sleeve'); COL.dash = g('--dash'); COL.table = g('--table');
  COL.stove = g('--stove'); COL.flame = g('--flame');
  COL.p = [g('--p1'), g('--p2')];
  FONT_BODY = getComputedStyle(document.body).fontFamily || 'sans-serif';
  FONT_DISPLAY = g('--font-display') || FONT_BODY;
}
function drawTable(ctx, c, W, H, tableY, lw) {
  ctx.fillStyle = c.table;
  ctx.fillRect(0, tableY, W, H - tableY);
  ctx.strokeStyle = c.ink; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(-5, tableY); ctx.lineTo(W + 5, tableY); ctx.stroke();
}
/* 주전자. 몸통 중심이 원점, 몸통 반지름이 1인 좌표에서 그린다. lid는 뚜껑이 들린 높이(음수가 위). */
const KETTLE_TIP = { x: -1.715, y: -0.645 };
function drawKettle(ctx, c, klw, lid) {
  ctx.strokeStyle = c.ink;
  // 손잡이
  ctx.beginPath(); ctx.moveTo(-0.66, -0.5); ctx.bezierCurveTo(-0.8, -1.62, 0.8, -1.62, 0.66, -0.5);
  ctx.lineWidth = 0.2; ctx.stroke();
  ctx.strokeStyle = c.kettleDk; ctx.lineWidth = Math.max(0.02, 0.2 - klw * 2); ctx.stroke();
  ctx.strokeStyle = c.ink; ctx.lineWidth = klw;
  // 주둥이
  ctx.beginPath();
  ctx.moveTo(-0.84, 0.48);
  ctx.bezierCurveTo(-1.38, 0.4, -1.42, -0.22, -1.8, -0.56);
  ctx.lineTo(-1.63, -0.73);
  ctx.bezierCurveTo(-1.34, -0.44, -1.24, -0.1, -0.88, -0.14);
  ctx.closePath();
  ctx.fillStyle = c.kettleDk; ctx.fill(); ctx.stroke();
  // 몸통
  ctx.beginPath();
  ctx.moveTo(-0.8, 0.74);
  ctx.quadraticCurveTo(-1.1, 0.72, -1.06, 0.26);
  ctx.bezierCurveTo(-1.0, -0.42, -0.56, -0.7, 0, -0.7);
  ctx.bezierCurveTo(0.56, -0.7, 1.0, -0.42, 1.06, 0.26);
  ctx.quadraticCurveTo(1.1, 0.72, 0.8, 0.74);
  ctx.closePath();
  ctx.fillStyle = c.kettle; ctx.fill(); ctx.stroke();
  // 바닥 띠
  ctx.beginPath(); ctx.moveTo(-1.02, 0.5); ctx.quadraticCurveTo(0, 0.6, 1.02, 0.5);
  ctx.lineWidth = klw * 0.8; ctx.stroke();
  // 윤기
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 0.09;
  ctx.beginPath(); ctx.moveTo(0.42, -0.5); ctx.quadraticCurveTo(0.78, -0.3, 0.86, 0.08); ctx.stroke();
  // 뚜껑과 꼭지
  ctx.strokeStyle = c.ink; ctx.lineWidth = klw;
  if (lid < -0.01) {
    ctx.beginPath(); ctx.ellipse(0, -0.68, 0.4, 0.07, 0, 0, TAU);
    ctx.fillStyle = c.ink; ctx.fill();
  }
  ctx.save();
  ctx.translate(0, lid);
  ctx.beginPath(); ctx.ellipse(0, -0.69, 0.46, 0.09, 0, 0, TAU);
  ctx.fillStyle = c.kettleDk; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -0.87, 0.1, 0, TAU);
  ctx.fillStyle = c.ink; ctx.fill();
  ctx.restore();
}
function paint(canvas, draw, s, t, dt) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
  if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(ctx, w, h, s, t, dt);
}

/* ═════════ 게임 1: 커피 따르기 ═════════ */

/* 종이컵은 위가 넓은 원뿔대라서 같은 양을 부어도 위로 갈수록 수위가 천천히 오른다.
   부피 비율 v(0~1)를 높이 비율 h(0~1)로 바꾼다. */
const CUP_K = 0.40;                      // (윗지름 / 아랫지름) - 1
const CUP_MM = 75;                       // 화면에 표시하는 컵 안쪽 높이(mm)
const V_FULL = 1 + CUP_K + CUP_K * CUP_K / 3;
function hFromV(v) {
  const y = clamp(v, 0, 1) * V_FULL;
  let h = clamp(v, 0, 1);
  for (let i = 0; i < 8; i++) {
    const f = h + CUP_K * h * h + CUP_K * CUP_K * h * h * h / 3 - y;
    const d = 1 + 2 * CUP_K * h + CUP_K * CUP_K * h * h;
    h -= f / d;
  }
  return clamp(h, 0, 1);
}

/* 한 판의 조건: 목표선과 따르는 속도. 그 판의 모든 사람이 같은 조건으로 겨룬다. */
function makeRound(opts) {
  const target = rand(0.50, 0.86);
  const T = rand(3.0, 5.0);              // 기준 속도로 컵이 가득 차는 시간(초)
  const pr = opts.irr ? {
    a1: rand(0.32, 0.50), f1: rand(0.30, 0.62), p1: rand(0, TAU),
    a2: rand(0.16, 0.30), f2: rand(0.95, 1.70), p2: rand(0, TAU)
  } : null;
  const mult = t => pr
    ? clamp(1 + pr.a1 * Math.sin(TAU * pr.f1 * t + pr.p1) + pr.a2 * Math.sin(TAU * pr.f2 * t + pr.p2), 0.4, 1.8)
    : 1;
  // 1ms 단위 누적 부피표. 프레임 속도와 무관하게 누른 시각만으로 수위가 정해진다.
  const cum = [0];
  let v = 0, i = 0;
  while (v < 1 && i < 30000) {
    v += mult((i + 0.5) / 1000) / T / 1000;
    cum.push(v);
    i++;
  }
  const prev = cum[i - 1];
  const brim = (i - 1 + (1 - prev) / Math.max(1e-9, cum[i] - prev)) / 1000;   // 가득 차는 시각(초)
  const vAt = t => {
    const x = clamp(t * 1000, 0, cum.length - 1);
    const j = Math.floor(x), f = x - j;
    return j + 1 < cum.length ? cum[j] + (cum[j + 1] - cum[j]) * f : cum[j];
  };
  return { target, mult, vAt, brim };
}

function mkScene() {
  return {
    h: 0, target: 0.7, tilt: 0, tiltGoal: 0,
    streamOn: false, sHead: 0, sTail: 0, mult: 1, pouring: false, wave: 0,
    sleeve: 0, sleeveGoal: 0, spill: 0, spillOn: false, steam: 0, steamOn: false,
    drain: false, parts: []
  };
}
function tickScene(s, dt) {
  s.tilt += (s.tiltGoal - s.tilt) * (1 - Math.exp(-dt * 10));
  if (s.streamOn) { s.sTail = 0; s.sHead = Math.min(1, s.sHead + dt / 0.22); }
  else if (s.sHead > 0) {
    s.sTail = Math.min(1, s.sTail + dt / 0.16);
    if (s.sTail >= 1) { s.sHead = 0; s.sTail = 0; }
  }
  s.wave += ((s.pouring ? 1 : 0) - s.wave) * (1 - Math.exp(-dt * (s.pouring ? 12 : 3)));
  s.sleeve += (s.sleeveGoal - s.sleeve) * (1 - Math.exp(-dt * 7));
  s.spill = s.spillOn ? Math.min(1, s.spill + dt / 0.9) : 0;
  s.steam += ((s.steamOn ? 1 : 0) - s.steam) * (1 - Math.exp(-dt * 3));
  if (s.drain && s.h > 0) s.h = Math.max(0, s.h - dt * 3);
}

function drawPour(ctx, W, H, s, t, dt) {
  const c = COL;
  ctx.clearRect(0, 0, W, H);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // 배치
  const tableY = Math.round(H - Math.max(20, H * 0.085));
  const ch = Math.min(H * 0.47, W * 0.6, 290);          // 컵 높이
  const tw = ch * 0.92, bw = tw * 0.7;                  // 컵 윗너비, 아랫너비
  const cx = W * 0.42;
  const top = tableY - ch;
  const lw = Math.max(2.5, ch * 0.016);
  const rimH = ch * 0.055;
  const floorY = tableY - ch * 0.05;
  const rimY = top + rimH * 0.6;
  const yAt = f => floorY - (floorY - rimY) * f;
  const halfAtY = y => (tw + (bw - tw) * ((y - top) / ch)) / 2;
  const cupPath = () => {
    ctx.beginPath();
    ctx.moveTo(cx - tw / 2, top); ctx.lineTo(cx + tw / 2, top);
    ctx.lineTo(cx + bw / 2, tableY); ctx.lineTo(cx - bw / 2, tableY);
    ctx.closePath();
  };
  const ellipse = (x, y, rx, ry) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); };

  drawTable(ctx, c, W, H, tableY, lw);
  ctx.fillStyle = 'rgba(42,21,9,.2)';
  ellipse(cx, tableY + lw * 1.6, bw * 0.66, Math.max(3, ch * 0.024));

  // 주전자 자세
  const TH = 0.62;                                       // 다 기울였을 때 각도(rad)
  const rot = (p, a) => ({ x: p.x * Math.cos(a) - p.y * Math.sin(a), y: p.x * Math.sin(a) + p.y * Math.cos(a) });
  const gap = ch * 0.24;
  const tipGoal = { x: cx + tw * 0.12, y: top - gap };
  const k = Math.max(8, Math.min(ch * 0.33, (top - gap - 6) / 1.92, (W - tipGoal.x - 4) / 2.95));
  const rFull = rot(KETTLE_TIP, -TH);
  const pivot = { x: tipGoal.x - rFull.x * k, y: tipGoal.y - rFull.y * k };
  const up = 1 - s.tilt;
  const ang = -TH * s.tilt;
  const px = pivot.x + up * k * 0.1;
  const py = pivot.y - up * k * 0.04 + Math.sin(t * 1.7) * k * 0.018 * up;
  const rt = rot(KETTLE_TIP, ang);
  const tip = { x: px + rt.x * k, y: py + rt.y * k };

  // 컵 안쪽
  cupPath(); ctx.fillStyle = c.cupIn; ctx.fill();

  // 커피
  const surfY = yAt(s.h);
  if (s.h > 0.002) {
    ctx.save();
    cupPath(); ctx.clip();
    const amp = s.wave * ch * 0.012;
    const wave = x => surfY + Math.sin(x * 0.11 + t * 10) * amp;
    ctx.beginPath();
    ctx.moveTo(cx - tw, floorY); ctx.lineTo(cx - tw, surfY);
    for (let x = cx - tw / 2 - 4; x <= cx + tw / 2 + 4; x += 6) ctx.lineTo(x, wave(x));
    ctx.lineTo(cx + tw, surfY); ctx.lineTo(cx + tw, floorY);
    ctx.closePath();
    ctx.fillStyle = c.coffee; ctx.fill();
    const cr = Math.min(Math.max(2, ch * 0.024), (floorY - surfY));
    ctx.strokeStyle = c.crema; ctx.lineWidth = cr; ctx.lineCap = 'butt';
    ctx.beginPath();
    for (let x = cx - tw / 2 - 4; x <= cx + tw / 2 + 4; x += 6) {
      const y = wave(x) + cr / 2;
      if (x === cx - tw / 2 - 4) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
    ctx.lineCap = 'round';
  }
  // 컵 바닥(굽)
  ctx.save();
  cupPath(); ctx.clip();
  ctx.fillStyle = c.cup; ctx.fillRect(cx - tw, floorY, tw * 2, tableY - floorY);
  ctx.restore();

  // 커피 줄기
  let land = null;
  if (s.sHead > 0 && s.sTail < 1) {
    const fall = Math.max(4, surfY - tip.y);
    const fallMax = Math.max(8, floorY - tip.y);
    const d = tw * 0.2 * Math.sqrt(Math.min(1, fall / fallMax));
    const P0 = tip, P1 = { x: tip.x - d / 2, y: tip.y }, P2 = { x: tip.x - d, y: surfY };
    const B = u => ({ x: (1 - u) * (1 - u) * P0.x + 2 * u * (1 - u) * P1.x + u * u * P2.x, y: (1 - u) * (1 - u) * P0.y + 2 * u * (1 - u) * P1.y + u * u * P2.y });
    const a = s.sTail, b = s.sHead;
    const Q0 = B(a), Q2 = B(b);
    const Q1 = {
      x: (1 - a) * (1 - b) * P0.x + (a * (1 - b) + b * (1 - a)) * P1.x + a * b * P2.x,
      y: (1 - a) * (1 - b) * P0.y + (a * (1 - b) + b * (1 - a)) * P1.y + a * b * P2.y
    };
    const sw = Math.max(2.5, k * 0.105 * (0.4 + 0.6 * s.mult));
    ctx.strokeStyle = c.coffee; ctx.lineWidth = sw;
    ctx.beginPath(); ctx.moveTo(Q0.x, Q0.y); ctx.quadraticCurveTo(Q1.x, Q1.y, Q2.x, Q2.y); ctx.stroke();
    ctx.strokeStyle = c.crema; ctx.lineWidth = Math.max(1, sw * 0.22); ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(Q0.x + sw * 0.2, Q0.y); ctx.quadraticCurveTo(Q1.x + sw * 0.2, Q1.y, Q2.x + sw * 0.2, Q2.y); ctx.stroke();
    ctx.globalAlpha = 1;
    if (s.sHead >= 1) land = P2;
  }

  // 튀는 방울. 블라인드 구간에서는 방울이 수위를 알려 주지 않게 한다.
  const hiddenSurf = s.sleeveGoal > 0 && s.h > s.target - 0.42;
  if (s.pouring && land && !hiddenSurf && s.parts.length < 26 && Math.random() < dt * 42 * s.mult) {
    s.parts.push({
      x: land.x, y: surfY,
      vx: (Math.random() - 0.5) * ch * 0.9,
      vy: -(0.5 + Math.random() * 0.8) * ch * 0.9,
      r: (0.6 + Math.random()) * lw * 0.7
    });
  }
  ctx.fillStyle = c.coffee;
  for (let i = s.parts.length - 1; i >= 0; i--) {
    const p = s.parts[i];
    p.vy += ch * 5 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y > surfY + 2 || Math.abs(p.x - cx) > halfAtY(p.y) - lw) { s.parts.splice(i, 1); continue; }
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }

  // 컵홀더(블라인드 구간)
  if (s.sleeve > 0.01) {
    const ya = yAt(Math.max(0.05, s.target - 0.27)), yb = yAt(Math.min(0.985, s.target + 0.12));
    const e = lw * 1.2;
    ctx.save();
    ctx.globalAlpha = Math.min(1, s.sleeve * 1.5);
    ctx.translate(0, (1 - s.sleeve) * ch * 0.3);
    const band = () => {
      ctx.beginPath();
      ctx.moveTo(cx - halfAtY(yb) - e, yb); ctx.lineTo(cx + halfAtY(yb) + e, yb);
      ctx.lineTo(cx + halfAtY(ya) + e, ya); ctx.lineTo(cx - halfAtY(ya) - e, ya);
      ctx.closePath();
    };
    band(); ctx.fillStyle = c.sleeve; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.strokeStyle = 'rgba(42,21,9,.22)'; ctx.lineWidth = Math.max(1.5, lw * 0.7);
    const step = ch * 0.075;
    for (let x = cx - tw; x < cx + tw; x += step) {
      ctx.beginPath(); ctx.moveTo(x, yb); ctx.lineTo(x - (ya - yb) * 0.25, ya); ctx.stroke();
    }
    ctx.restore();
    band(); ctx.strokeStyle = c.ink; ctx.lineWidth = lw; ctx.stroke();
    ctx.restore();
  }

  // 컵 외곽선
  cupPath(); ctx.strokeStyle = c.ink; ctx.lineWidth = lw; ctx.stroke();
  ctx.lineWidth = lw * 0.7;
  ctx.beginPath(); ctx.moveTo(cx - halfAtY(floorY), floorY); ctx.lineTo(cx + halfAtY(floorY), floorY); ctx.stroke();

  // 넘쳐흐른 커피
  if (s.spill > 0) {
    const L = ch * (0.2 + 0.72 * s.spill);
    ctx.strokeStyle = c.coffee; ctx.lineWidth = Math.max(4, ch * 0.04);
    [-1, 1].forEach(side => {
      const y0 = top + rimH * 0.4;
      const y1 = Math.min(tableY - 3, y0 + L * (side < 0 ? 1 : 0.78));
      ctx.beginPath();
      ctx.moveTo(cx + side * (halfAtY(y0) + lw * 1.2), y0);
      ctx.lineTo(cx + side * (halfAtY(y1) + lw * 1.2), y1);
      ctx.stroke();
    });
    ctx.fillStyle = c.coffee;
    ellipse(cx, tableY + lw * 1.4, bw * 0.5 + tw * 0.5 * s.spill, 1 + ch * 0.032 * s.spill);
  }

  // 컵 테두리(말린 림)
  const rx = cx - tw / 2 - rimH * 0.35, ry = top - rimH * 0.45, rw = tw + rimH * 0.7, rr = rimH / 2;
  ctx.beginPath();
  ctx.moveTo(rx + rr, ry); ctx.lineTo(rx + rw - rr, ry);
  ctx.arc(rx + rw - rr, ry + rr, rr, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(rx + rr, ry + rimH);
  ctx.arc(rx + rr, ry + rr, rr, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  ctx.fillStyle = c.cup; ctx.fill();
  ctx.strokeStyle = c.ink; ctx.lineWidth = lw; ctx.stroke();

  // 목표선
  const ty = yAt(s.target), thw = halfAtY(ty);
  ctx.setLineDash([ch * 0.05, ch * 0.05]);
  ctx.beginPath(); ctx.moveTo(cx - thw + lw * 2.2, ty); ctx.lineTo(cx + thw - lw * 2.2, ty);
  ctx.strokeStyle = c.ink; ctx.lineWidth = lw * 2; ctx.stroke();
  ctx.strokeStyle = c.dash; ctx.lineWidth = lw * 0.95; ctx.stroke();
  ctx.setLineDash([]);
  const ms = ch * 0.05;
  ctx.fillStyle = c.kettle; ctx.strokeStyle = c.ink; ctx.lineWidth = lw * 0.7;
  [-1, 1].forEach(side => {
    const x0 = cx + side * (thw + lw * 1.6);
    ctx.beginPath();
    ctx.moveTo(x0, ty); ctx.lineTo(x0 + side * ms * 1.5, ty - ms); ctx.lineTo(x0 + side * ms * 1.5, ty + ms);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });
  const fs = clamp(ch * 0.078, 11, 17);
  ctx.font = '700 ' + fs + 'px ' + FONT_BODY;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = c.ink;
  ctx.fillText('목표선', cx + thw + lw * 1.6 + ms * 1.5 + fs * 0.45, ty + 1);

  // 김
  if (s.steam > 0.02) {
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.7 * s.steam).toFixed(3) + ')';
    ctx.lineWidth = lw * 1.3;
    for (let i = 0; i < 3; i++) {
      const x0 = cx + (i - 1) * tw * 0.24;
      ctx.beginPath();
      for (let j = 0; j <= 12; j++) {
        const u = j / 12;
        const y = top - ch * 0.07 - u * ch * 0.3;
        const x = x0 + Math.sin(u * 5 + t * 2.2 + i * 1.7) * ch * 0.028 * (0.4 + u);
        if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  // 주전자
  ctx.save();
  ctx.translate(px, py); ctx.rotate(ang); ctx.scale(k, k);
  drawKettle(ctx, c, lw / k, 0);
  ctx.restore();
}

/* ═════════ 게임 2: 주전자 끓이기(반응속도) ═════════ */
function mkBoil() { return { on: false, armed: false, burst: 0, heat: 0.35, puffs: [] }; }
function tickBoil(b, dt) {
  b.burst += ((b.on ? 1 : 0) - b.burst) * (1 - Math.exp(-dt * (b.on ? 22 : 7)));
  b.heat += ((b.armed ? 1 : 0.35) - b.heat) * (1 - Math.exp(-dt * 6));
}
function drawBoil(ctx, W, H, b, t, dt) {
  const c = COL;
  ctx.clearRect(0, 0, W, H);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  const tableY = Math.round(H - Math.max(20, H * 0.085));
  const k = Math.max(10, Math.min(W * 0.24, tableY * 0.25, 110));    // 주전자 크기
  const lw = Math.max(2.5, k * 0.042);
  const px = W * 0.56;
  const stoveH = k * 0.5, stoveW = k * 3.0, plateH = k * 0.1, gapF = k * 0.4;
  const plateY = tableY - stoveH - plateH;      // 삼발이 판 윗면
  const baseY = plateY - gapF;                  // 주전자 바닥
  const py = baseY - 0.74 * k;
  const hot = b.burst;

  // 신호가 뜨면 뒤에 햇살 무늬가 퍼진다
  if (hot > 0.01) {
    const R = Math.hypot(W, H);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.66 * hot).toFixed(3) + ')';
    for (let i = 0; i < 12; i++) {
      const a = i * TAU / 12 + t * 0.4, w = TAU / 48;
      ctx.beginPath(); ctx.moveTo(px, py);
      ctx.lineTo(px + R * Math.cos(a - w), py + R * Math.sin(a - w));
      ctx.lineTo(px + R * Math.cos(a + w), py + R * Math.sin(a + w));
      ctx.closePath(); ctx.fill();
    }
  }

  drawTable(ctx, c, W, H, tableY, lw);

  // 휴대용 버너
  const sx = px - stoveW / 2, sy = tableY - stoveH, sr = k * 0.12;
  ctx.beginPath();
  ctx.moveTo(sx + sr, sy); ctx.lineTo(sx + stoveW - sr, sy);
  ctx.quadraticCurveTo(sx + stoveW, sy, sx + stoveW, sy + sr);
  ctx.lineTo(sx + stoveW, tableY); ctx.lineTo(sx, tableY); ctx.lineTo(sx, sy + sr);
  ctx.quadraticCurveTo(sx, sy, sx + sr, sy);
  ctx.closePath();
  ctx.fillStyle = c.stove; ctx.fill();
  ctx.strokeStyle = c.ink; ctx.lineWidth = lw; ctx.stroke();
  ctx.beginPath(); ctx.arc(sx + stoveW * 0.16, sy + stoveH * 0.52, k * 0.13, 0, TAU);
  ctx.fillStyle = c.dash; ctx.fill(); ctx.lineWidth = lw * 0.8; ctx.stroke();
  ctx.lineWidth = lw * 0.8;
  for (let i = 0; i < 3; i++) {
    const x = sx + stoveW * (0.7 + i * 0.07);
    ctx.beginPath(); ctx.moveTo(x, sy + stoveH * 0.3); ctx.lineTo(x, sy + stoveH * 0.72); ctx.stroke();
  }
  // 삼발이
  ctx.fillStyle = c.ink;
  ctx.fillRect(px - k * 1.25, plateY, k * 2.5, plateH + lw * 0.5);
  ctx.lineWidth = lw * 1.6;
  [-1, 1].forEach(side => {
    ctx.beginPath(); ctx.moveTo(px + side * k * 0.98, plateY); ctx.lineTo(px + side * k * 0.98, baseY + lw); ctx.stroke();
  });
  // 불꽃
  const fh = gapF * (0.45 + 0.6 * b.heat);
  for (let i = 0; i < 5; i++) {
    const x = px + (i - 2) * k * 0.31;
    const h = fh * (0.82 + 0.22 * Math.sin(t * 13 + i * 1.9));
    const w = k * 0.11;
    const flame = (hh, ww) => {
      ctx.beginPath();
      ctx.moveTo(x - ww, plateY);
      ctx.quadraticCurveTo(x - ww, plateY - hh * 0.55, x, plateY - hh);
      ctx.quadraticCurveTo(x + ww, plateY - hh * 0.55, x + ww, plateY);
      ctx.closePath();
    };
    flame(h, w); ctx.fillStyle = c.flame; ctx.fill();
    ctx.strokeStyle = c.ink; ctx.lineWidth = lw * 0.6; ctx.stroke();
    flame(h * 0.5, w * 0.5); ctx.fillStyle = c.dash; ctx.fill();
  }

  // 주전자. 기다리는 동안의 떨림은 일정하게 유지해 신호 시점을 알 수 없게 한다.
  const shake = (b.armed ? 0.006 : 0) + hot * 0.03;
  const jx = Math.sin(t * 37) * k * shake, jy = Math.cos(t * 29) * k * shake * 0.6;
  ctx.save();
  ctx.translate(px + jx, py + jy);
  ctx.rotate(Math.sin(t * 33) * 0.025 * hot);
  ctx.scale(k, k);
  drawKettle(ctx, c, lw / k, -hot * (0.2 + 0.05 * Math.sin(t * 26)));
  ctx.restore();

  // 김
  const tipX = px + KETTLE_TIP.x * k, tipY = py + KETTLE_TIP.y * k;
  const calm = b.heat * (1 - hot);
  if (calm > 0.05) {
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.75 * calm).toFixed(3) + ')';
    ctx.lineWidth = lw * 1.2;
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      for (let j = 0; j <= 10; j++) {
        const u = j / 10;
        const x = tipX - k * 0.1 - i * k * 0.2 - u * k * 0.25 + Math.sin(u * 5 + t * 2.4 + i * 2) * k * 0.07 * (0.3 + u);
        const y = tipY - k * 0.12 - u * k * 0.7;
        if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  if (b.on) {
    const n = dt * 60;
    let m = Math.floor(n) + (Math.random() < n % 1 ? 1 : 0);
    while (m-- > 0 && b.puffs.length < 70) {
      const lidPuff = Math.random() < 0.3;
      const side = Math.random() < 0.5 ? -1 : 1;
      b.puffs.push(lidPuff
        ? { x: px + side * k * 0.4, y: py - k * 0.75, vx: side * k * rand(0.3, 1.1), vy: -k * rand(1.4, 2.6), r: k * 0.08, life: 0, max: rand(0.5, 0.9) }
        : { x: tipX, y: tipY, vx: -k * rand(1.4, 3.0), vy: -k * rand(1.6, 3.6), r: k * 0.1, life: 0, max: rand(0.6, 1.1) });
    }
  }
  for (let i = b.puffs.length - 1; i >= 0; i--) {
    const p = b.puffs[i];
    p.life += dt;
    if (p.life >= p.max) { b.puffs.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 1 - Math.min(1, 1.6 * dt);
    p.r += k * 0.55 * dt;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * (1 - p.life / p.max)).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  }
  // 삑 소리 선
  if (hot > 0.3) {
    ctx.strokeStyle = c.ink; ctx.lineWidth = lw;
    [-2.05, -2.5, -2.95].forEach(a => {
      ctx.beginPath();
      ctx.moveTo(tipX + Math.cos(a) * k * 0.28, tipY + Math.sin(a) * k * 0.28);
      ctx.lineTo(tipX + Math.cos(a) * k * (0.5 + 0.1 * hot), tipY + Math.sin(a) * k * (0.5 + 0.1 * hot));
      ctx.stroke();
    });
  }
}

/* ═════════ 게임 3: 비행기 맞대결(2명 동시) ═════════ */
const DUEL_LIVES = 3;
const DUEL_LIMIT = 60;                   // 이 시간(초)까지 승부가 안 나면 남은 목숨으로 가린다
const DUEL_INV = 1.1;                    // 맞은 뒤 잠깐 맞지 않는 시간(초)
/* 시간이 갈수록 미사일이 촘촘하고 빨라지며, 나중에는 여러 갈래로 나간다. 두 사람 조건은 항상 같다. */
function duelLevel(t) {
  return {
    interval: Math.max(0.15, 0.46 - 0.011 * t),
    speed: Math.min(1.6, 0.8 + 0.022 * t),          // 경기장 높이를 1로 본 초당 속도
    ways: t < 12 ? 1 : t < 28 ? 3 : 5
  };
}
function mkDuel(demo) {
  return {
    demo: !!demo, t: 0, fireAt: 0.5, ways: 1, banner: null,
    planes: [0, 1].map(() => ({ x: 0.5, tx: 0.5, vx: 0, lives: DUEL_LIVES, inv: 0, hits: 0, kb: false })),
    shots: [], fx: []
  };
}
/* 위치는 경기장 너비·높이를 1로 본 값으로 둔다. 0번이 위쪽, 1번이 아래쪽 비행기. */
function duelGeom(W, H) {
  const ps = clamp(Math.min(W * 0.14, H * 0.16), 24, 58);    // 비행기 길이(px)
  const edge = (ps * 0.62 + 10) / H;
  return { ps, r: ps * 0.34, y: [edge, 1 - edge], m: ps * 0.5 / W };
}
function duelMove(d, dt, g) {
  d.planes.forEach(p => {
    const lim = 1.6 * dt;                            // 너비를 0.6초쯤에 가로지르는 최고 속도
    const dx = clamp(clamp(p.tx, g.m, 1 - g.m) - p.x, -lim, lim);
    p.x += dx;
    p.vx += (dx / Math.max(dt, 1e-4) - p.vx) * Math.min(1, dt * 14);
  });
}
function duelStep(d, dt, W, H) {
  const g = duelGeom(W, H);
  d.t += dt;
  duelMove(d, dt, g);
  d.planes.forEach(p => { p.inv = Math.max(0, p.inv - dt); });
  const lv = duelLevel(d.demo ? d.t % 26 : d.t);
  if (lv.ways !== d.ways) {
    if (!d.demo && lv.ways > d.ways) d.banner = { text: '미사일 ' + lv.ways + '갈래!', at: d.t };
    d.ways = lv.ways;
  }
  const ev = { fired: false, hit: [] };
  if (d.t >= d.fireAt) {
    d.fireAt = d.t + lv.interval;
    ev.fired = true;
    d.planes.forEach((p, o) => {
      if (p.lives <= 0) return;
      const dir = o === 0 ? 1 : -1;                  // 위쪽 비행기는 아래로 쏜다
      for (let i = 0; i < lv.ways; i++) {
        const a = (i - (lv.ways - 1) / 2) * 0.16;    // 갈래 사이 각도 약 9도
        d.shots.push({ o, x: p.x, y: g.y[o] + dir * g.ps * 0.5 / H, vx: Math.tan(a) * lv.speed * H / W, vy: dir * lv.speed });
      }
    });
  }
  const rr = (g.r + g.ps * 0.09) * (g.r + g.ps * 0.09);
  for (let i = d.shots.length - 1; i >= 0; i--) {
    const s = d.shots[i];
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y < -0.06 || s.y > 1.06 || s.x < -0.06 || s.x > 1.06) { d.shots.splice(i, 1); continue; }
    if (d.demo) continue;
    const q = 1 - s.o, tp = d.planes[q];
    if (tp.inv > 0 || tp.lives <= 0) continue;
    const dx = (s.x - tp.x) * W, dy = (s.y - g.y[q]) * H;
    if (dx * dx + dy * dy < rr) {
      d.shots.splice(i, 1);
      tp.lives--; tp.inv = DUEL_INV;
      d.planes[s.o].hits++;
      d.fx.push({ x: tp.x, y: g.y[q], at: d.t });
      ev.hit.push(q);
    }
  }
  return ev;
}
/* 비행기. 중심이 원점, 기수가 위(-y), 길이의 절반이 1인 좌표에서 그린다. */
function drawPlane(ctx, c, color, lwU, t) {
  ctx.strokeStyle = c.ink; ctx.lineWidth = lwU;
  // 분사 불꽃
  ctx.beginPath(); ctx.moveTo(-0.11, 0.93); ctx.lineTo(0, 1.22 + 0.1 * Math.sin(t * 40)); ctx.lineTo(0.11, 0.93); ctx.closePath();
  ctx.fillStyle = c.flame; ctx.fill();
  // 날개
  ctx.beginPath();
  ctx.moveTo(0, -0.3); ctx.lineTo(1, 0.3); ctx.lineTo(1, 0.5); ctx.lineTo(0.16, 0.34);
  ctx.lineTo(-0.16, 0.34); ctx.lineTo(-1, 0.5); ctx.lineTo(-1, 0.3); ctx.closePath();
  ctx.fillStyle = color; ctx.fill(); ctx.stroke();
  // 꼬리 날개
  ctx.beginPath();
  ctx.moveTo(0, 0.5); ctx.lineTo(0.45, 0.86); ctx.lineTo(0.45, 0.98); ctx.lineTo(-0.45, 0.98); ctx.lineTo(-0.45, 0.86); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 동체
  ctx.beginPath();
  ctx.moveTo(0, -1);
  ctx.bezierCurveTo(0.24, -0.8, 0.22, -0.3, 0.19, 0.3);
  ctx.lineTo(0.11, 0.95); ctx.lineTo(-0.11, 0.95); ctx.lineTo(-0.19, 0.3);
  ctx.bezierCurveTo(-0.22, -0.3, -0.24, -0.8, 0, -1);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 조종석
  ctx.beginPath(); ctx.ellipse(0, -0.42, 0.09, 0.19, 0, 0, TAU);
  ctx.fillStyle = c.cup; ctx.fill(); ctx.lineWidth = lwU * 0.7; ctx.stroke();
}
function drawDuel(ctx, W, H, d, t) {
  const c = COL, g = duelGeom(W, H), ps = g.ps;
  ctx.clearRect(0, 0, W, H);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  const lw = Math.max(2, ps * 0.05);

  // 구름
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 4; i++) {
    const s = ps * (0.5 + (i % 2) * 0.25);
    const x = ((i * 0.37 + t * (0.012 + i * 0.004)) % 1.4 - 0.2) * W, y = H * (0.2 + i * 0.2);
    [[0, 0, 1], [0.9, 0.15, 0.75], [-0.9, 0.2, 0.65]].forEach(([ox, oy, k]) => {
      ctx.beginPath(); ctx.arc(x + ox * s, y + oy * s, s * k, 0, TAU); ctx.fill();
    });
  }
  // 가운데 선
  ctx.save();
  ctx.setLineDash([ps * 0.3, ps * 0.26]);
  ctx.globalAlpha = 0.7; ctx.strokeStyle = c.kettle; ctx.lineWidth = lw * 1.2;
  ctx.beginPath(); ctx.moveTo(10, H / 2); ctx.lineTo(W - 10, H / 2); ctx.stroke();
  ctx.restore();

  // 미사일
  d.shots.forEach(s => {
    const vx = s.vx * W, vy = s.vy * H, n = Math.hypot(vx, vy) || 1;
    const ux = vx / n * ps * 0.19, uy = vy / n * ps * 0.19;
    const x = s.x * W, y = s.y * H;
    ctx.beginPath(); ctx.moveTo(x - ux, y - uy); ctx.lineTo(x + ux, y + uy);
    ctx.strokeStyle = c.ink; ctx.lineWidth = ps * 0.19; ctx.stroke();
    ctx.strokeStyle = c.p[s.o]; ctx.lineWidth = ps * 0.1; ctx.stroke();
  });

  // 비행기. 맞은 직후에는 깜빡인다.
  d.planes.forEach((p, o) => {
    if (p.lives <= 0) return;
    if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0) return;
    ctx.save();
    ctx.translate(p.x * W, g.y[o] * H);
    ctx.rotate((o === 0 ? Math.PI : 0) + clamp(p.vx * 0.1, -0.22, 0.22) * (o === 0 ? -1 : 1));
    ctx.scale(ps / 2, ps / 2);
    drawPlane(ctx, c, c.p[o], lw / (ps / 2), t);
    ctx.restore();
  });

  // 맞았을 때의 별 모양 폭발
  for (let i = d.fx.length - 1; i >= 0; i--) {
    const f = d.fx[i], age = (d.t - f.at) / 0.45;
    if (age >= 1) { d.fx.splice(i, 1); continue; }
    const R = ps * (0.55 + 0.9 * age);
    ctx.save();
    ctx.translate(f.x * W, f.y * H); ctx.rotate(age * 0.6);
    ctx.globalAlpha = 1 - age * age;
    ctx.beginPath();
    for (let j = 0; j < 20; j++) {
      const rad = j % 2 ? R * 0.55 : R, a = j * TAU / 20;
      if (j === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad); else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = c.dash; ctx.fill();
    ctx.strokeStyle = c.ink; ctx.lineWidth = lw; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, R * 0.3, 0, TAU); ctx.fillStyle = c.cup; ctx.fill();
    ctx.restore();
  }

  // 단계가 올라갈 때 양쪽에서 읽을 수 있게 두 번 쓴다
  if (d.banner) {
    const age = (d.t - d.banner.at) / 1.3;
    if (age >= 1) d.banner = null;
    else {
      ctx.save();
      ctx.globalAlpha = Math.min(1, (1 - age) * 3);
      ctx.fillStyle = c.ink;
      ctx.font = '400 ' + Math.round(ps * 0.62) + 'px ' + FONT_DISPLAY;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(d.banner.text, W / 2, H / 2 + ps * 0.75);
      ctx.translate(W / 2, H / 2 - ps * 0.75); ctx.rotate(Math.PI);
      ctx.fillText(d.banner.text, 0, 0);
      ctx.restore();
    }
  }
}

/* ───────── 설정 화면 ───────── */
const KEY = 'coffeegame.cfg.v1';
const cfg = { game: 'pour', n: 3, names: [], rounds: 1, irr: true, blind: false, sfx: true };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved && typeof saved === 'object') {
    if (['pour', 'react', 'duel'].includes(saved.game)) cfg.game = saved.game;
    if (Number.isInteger(saved.n)) cfg.n = clamp(saved.n, 2, 8);
    if (Array.isArray(saved.names)) cfg.names = saved.names.slice(0, 8).map(x => String(x || '').slice(0, 8));
    if ([1, 3, 5].includes(saved.rounds)) cfg.rounds = saved.rounds;
    ['irr', 'blind', 'sfx'].forEach(k2 => { if (typeof saved[k2] === 'boolean') cfg[k2] = saved[k2]; });
  }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} };

function renderNames() {
  const box = $('names');
  box.textContent = '';
  for (let i = 0; i < cfg.n; i++) {
    const lab = document.createElement('label');
    lab.className = 'name';
    const num = document.createElement('span');
    num.textContent = i + 1;
    const inp = document.createElement('input');
    inp.id = 'name-' + i; inp.type = 'text'; inp.maxLength = 8;
    inp.placeholder = (i + 1) + '번';
    inp.value = cfg.names[i] || '';
    inp.setAttribute('aria-label', (i + 1) + '번 이름');
    inp.setAttribute('enterkeyhint', 'done');
    inp.addEventListener('input', () => { cfg.names[i] = inp.value; save(); });
    lab.appendChild(num); lab.appendChild(inp);
    box.appendChild(lab);
  }
  $('n-out').textContent = cfg.n + '명';
  $('n-dec').disabled = cfg.n <= 2;
  $('n-inc').disabled = cfg.n >= 8;
}
$('n-dec').addEventListener('click', () => { cfg.n = clamp(cfg.n - 1, 2, 8); save(); renderNames(); });
$('n-inc').addEventListener('click', () => { cfg.n = clamp(cfg.n + 1, 2, 8); save(); renderNames(); });
$('rounds-' + cfg.rounds).checked = true;
document.querySelectorAll('input[name="rounds"]').forEach(r => r.addEventListener('change', () => { cfg.rounds = Number(r.value); save(); }));
[['opt-irr', 'irr'], ['opt-blind', 'blind'], ['opt-sfx', 'sfx']].forEach(([id, key]) => {
  $(id).checked = cfg[key];
  $(id).addEventListener('change', () => { cfg[key] = $(id).checked; save(); });
});
renderNames();

/* ───────── 화면 전환 ───────── */
const screens = { setup: $('setup'), play: $('play'), duel: $('duel'), result: $('result') };
let cur = 'setup';
function show(name) {
  for (const k2 in screens) screens[k2].hidden = k2 !== name;
  cur = name;
  screens[name].scrollTop = 0;
}

let wakeLock = null;
function wake() {
  try {
    if (navigator.wakeLock && cur !== 'setup' && !document.hidden) {
      navigator.wakeLock.request('screen').then(l => { wakeLock = l; }).catch(() => {});
    }
  } catch (e) {}
}
function unwake() { try { if (wakeLock) wakeLock.release(); } catch (e) {} wakeLock = null; }

/* ───────── 게임 진행(공통) ───────── */
let G = null;                            // 진행 중인 게임
let phase = 'idle';
let token = 0, gameSeq = 0;
const btnGo = $('btn-go'), btnBig = $('btn-stop'), btnNext = $('btn-next');
const NEXT_HINT = '폰을 넘겨받았으면 시작하세요.';

function newGame(game, names, rounds, opts) {
  G = {
    game, mod: MODS[game],
    players: names.map(name => ({ name, pts: 0, bad: 0, sum: 0, cnt: 0 })),
    rounds, opts, r: 0, offset: gameSeq++, round: null, order: [], turn: 0, results: []
  };
  startRound();
}
function startRound() {
  const n = G.players.length;
  G.round = G.mod.newRound(G.opts);
  G.order = Array.from({ length: n }, (_, i) => (i + G.offset + G.r) % n);   // 판마다 첫 순서를 돌린다
  G.turn = 0;
  G.results = [];
  show('play');
  wake();
  toReady();
}
function lockBriefly(btn, ms) {
  btn.disabled = true;
  const my = token;
  setTimeout(() => { if (my === token) btn.disabled = false; }, ms);
}
function renderHud(noCurrent) {
  $('hud-round').textContent = G.rounds > 1 ? (G.r + 1) + '판 / ' + G.rounds + '판' : '한 판 승부';
  const chips = $('chips');
  chips.innerHTML = G.order.map((p, i) => {
    const name = esc(G.players[p].name);
    const r = G.results[i];
    if (r) return '<li class="chip' + (r.bad ? ' over' : '') + '">' + name + ' <b>' + esc(r.chip) + '</b></li>';
    if (i === G.turn && !noCurrent) return '<li class="chip now">' + name + '</li>';
    return '<li class="chip todo">' + name + '</li>';
  }).join('');
  const now = chips.querySelector('.now');
  if (now && now.scrollIntoView) now.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function bigBtn(label, waiting) {
  btnBig.hidden = false;
  btnBig.textContent = label;
  btnBig.classList.toggle('wait', waiting);
}
function showWord(text, word) {
  const el = $('count');
  el.hidden = false;
  el.textContent = text;
  el.classList.toggle('word', !!word);
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}
function toReady() {
  token++;
  phase = 'ready';
  SFX.pourStop();
  const ui = G.mod.ready(G.turn === 0 && G.r === 0);
  $('who-name').textContent = G.players[G.order[G.turn]].name;
  $('who-hint').textContent = ui.hint;
  btnGo.textContent = ui.go;
  $('count').hidden = true;
  $('stamp').hidden = true;
  $('p-ready').hidden = false;
  btnBig.hidden = true;
  $('p-done').hidden = true;
  renderHud();
  lockBriefly(btnGo, 450);
}
function go() {
  if (phase !== 'ready') return;
  token++;
  $('p-ready').hidden = true;
  SFX.init();
  G.mod.go();
}
/* 한 사람의 차례가 끝났을 때: 기록을 남기고 잠시 뒤 판정을 보여 준다. */
function endTurn(res, ui) {
  token++;
  const my = token;
  phase = 'done';
  res.p = G.order[G.turn];
  G.results.push(res);
  SFX.pourStop();
  SFX.click();
  const lastTurn = G.turn + 1 >= G.order.length;
  btnNext.textContent = lastTurn
    ? (G.r + 1 >= G.rounds ? '최종 결과 보기' : (G.r + 1) + '판 결과 보기')
    : '다음: ' + G.players[G.order[G.turn + 1]].name;
  btnBig.hidden = true;
  $('count').hidden = true;
  setTimeout(() => {
    if (my !== token) return;
    $('verdict').textContent = ui.verdict;
    $('verdict').classList.toggle('bad', !!ui.bad);
    $('detail').textContent = ui.detail;
    $('p-done').hidden = false;
    if (ui.stamp) {
      const st = $('stamp');
      st.textContent = ui.stamp;
      st.classList.toggle('good', !ui.bad);
      st.hidden = false;
    }
    renderHud(true);
    SFX[ui.snd]();
    lockBriefly(btnNext, 550);
  }, ui.delay);
}
function next() {
  if (phase !== 'done') return;
  if (G.turn + 1 < G.order.length) { G.turn++; toReady(); return; }
  endRound();
}
function evTime(e) {
  const n = performance.now();
  const t = e && e.timeStamp;
  return (typeof t === 'number' && t > 0 && Math.abs(n - t) < 500) ? t : n;
}

/* ───────── 게임 1 진행: 커피 따르기 ───────── */
const S = mkScene();
let tCount = 0, tPour = 0, lastCount = 0;
const COUNT_MS = 1800;
const POUR = {
  title: '선 넘지 마!',
  rules: [
    '돌아가며 한 번씩, 따라지는 커피를 버튼으로 멈춥니다.',
    '목표선에 가까울수록 순위가 높습니다.',
    '선을 넘기면 무조건 하위, 많이 넘길수록 더 아래입니다.'
  ],
  tieNote: '동점이면 넘긴 횟수가 적은 쪽, 그다음은 평균 오차가 작은 쪽이 위입니다.',
  draw: drawPour, scene: S, tick: tickScene,
  newRound: opts => makeRound(opts),
  ready(first) {
    S.target = G.round.target;
    S.tiltGoal = 0; S.streamOn = false; S.pouring = false; S.mult = 1;
    S.spillOn = false; S.steamOn = false; S.drain = true;
    S.sleeveGoal = G.opts.blind ? 1 : 0;
    return { go: '따르기 시작', hint: first ? '버튼을 누르면 셋을 센 뒤 커피를 따릅니다.' : NEXT_HINT };
  },
  go() {
    phase = 'count';
    S.drain = false; S.h = 0; S.parts.length = 0;
    tCount = performance.now();
    tPour = tCount + COUNT_MS;
    lastCount = 0;
    bigBtn('준비', true);
    [0, 0.6, 1.2].forEach(at => SFX.tone(520, 0.09, { at, type: 'square', vol: 0.07 }));
    SFX.tone(1040, 0.16, { at: 1.8, type: 'square', vol: 0.07 });
  },
  update(now) {
    if (phase === 'count') {
      const n = 3 - Math.floor((now - tCount) / 600);
      if (n !== lastCount && n >= 1) { lastCount = n; showWord(n, false); }
      if (now >= tPour - 520) S.tiltGoal = 1;
      if (now >= tPour - 220) S.streamOn = true;
      if (now >= tPour) {
        phase = 'pour';
        $('count').hidden = true;
        S.pouring = true; S.sHead = 1;
        bigBtn('멈춰!', false);
        SFX.pourStart();
      }
    }
    if (phase === 'pour') {
      const el = (now - tPour) / 1000;
      if (el >= G.round.brim) { POUR.finish(tPour + G.round.brim * 1000, true); return; }
      S.h = hFromV(G.round.vAt(el));
      S.mult = G.round.mult(el);
      SFX.pourSet(S.h, S.mult);
    }
  },
  press(ts) {
    if (phase !== 'pour') return;
    if (ts - tPour < 250) return;          // 시작 직후의 실수 터치는 무시
    POUR.finish(ts, false);
  },
  finish(ts, brim) {
    const R = G.round;
    const el = clamp((ts - tPour) / 1000, 0, R.brim);
    const h = brim ? 1 : hFromV(R.vAt(el));
    S.h = h; S.pouring = false; S.streamOn = false; S.tiltGoal = 0; S.mult = 1; S.sleeveGoal = 0;
    if (brim) S.spillOn = true; else S.steamOn = true;
    const err = (h - R.target) * CUP_MM;
    const over = err > 1e-6;
    const a = Math.abs(err);
    // 안 넘긴 사람이 먼저(선에 가까운 순), 넘긴 사람은 그 아래(덜 넘긴 순)
    const res = {
      h, err, over, brim, bad: over, stat: a,
      key: over ? 1e6 + err : -err,
      chip: brim ? '넘침' : (over ? '+' : '−') + mm(err),
      text: brim ? '가득 넘침' : over ? '+' + overMm(err) + 'mm 넘김' : mm(err) + 'mm 남김'
    };
    const ui = { delay: G.opts.blind ? 650 : 380, bad: over };
    if (brim) { ui.verdict = '철철 넘쳤습니다'; ui.detail = '컵이 가득 차도록 멈추지 않았습니다.'; ui.stamp = '넘침!'; ui.snd = 'flood'; }
    else if (over) { ui.verdict = '선 넘었습니다'; ui.detail = '목표선보다 ' + overMm(err) + 'mm 더 따랐습니다.'; ui.stamp = '선 넘음!'; ui.snd = 'over'; }
    else {
      ui.detail = '목표선까지 ' + mm(err) + 'mm 남겼습니다.';
      if (a < 0.5) { ui.verdict = '딱 맞췄습니다'; ui.stamp = '딱!'; ui.snd = 'perfect'; }
      else if (a < 2) { ui.verdict = '아슬아슬합니다'; ui.snd = 'close'; }
      else if (a < 7) { ui.verdict = '무난합니다'; ui.snd = 'ok'; }
      else { ui.verdict = '너무 일찍 멈췄습니다'; ui.snd = 'meh'; }
    }
    endTurn(res, ui);
  },
  abort() { S.h = 0; },
  icon: r => miniCup(r.h, G.round.target),
  why: r => r.brim ? '컵이 넘치도록 따랐습니다.'
    : r.over ? '선을 ' + overMm(r.err) + 'mm 넘겼습니다.'
    : '목표선에서 ' + mm(r.err) + 'mm 모자랐습니다.',
  total: (P, avg) => '넘김 ' + P.bad + '회 · 평균 오차 ' + mm(avg) + 'mm'
};

/* ───────── 게임 2 진행: 주전자 끓이기 ───────── */
const B = mkBoil();
let tArm = 0, tSignal = 0, tShown = 0;
const LATE_MS = 3000;                    // 신호 뒤 이 시간 안에 못 누르면 시간 초과
const FALSE_MS = 100;                    // 신호 뒤 이보다 빨리 누르면 예측으로 본다
const REACT = {
  title: '끓으면 눌러!',
  rules: [
    '돌아가며 한 번씩, 주전자가 끓는 순간 버튼을 누릅니다.',
    '빨리 누를수록 순위가 높습니다.',
    '끓기 전에 누르면 실격, 무조건 꼴찌입니다.'
  ],
  tieNote: '동점이면 실격이 적은 쪽, 그다음은 평균 반응 시간이 빠른 쪽이 위입니다.',
  draw: drawBoil, scene: B, tick: tickBoil,
  newRound: () => ({}),
  ready(first) {
    B.on = false; B.armed = false;
    return { go: '준비 완료', hint: first ? '주전자가 끓으면 바로 누르세요. 미리 누르면 실격입니다.' : NEXT_HINT };
  },
  go() {
    phase = 'wait';
    tArm = performance.now();
    tSignal = tArm + rand(2000, 6000);   // 끓는 시점은 차례마다 무작위
    B.armed = true; B.on = false;
    bigBtn('기다려', true);
    SFX.simmer();
  },
  update(now) {
    if (phase === 'wait' && now >= tSignal) {
      phase = 'signal';
      tShown = now;
      B.on = true;
      bigBtn('지금!', false);
      showWord('지금!', true);
      SFX.pourStop();
      SFX.whistle();
    } else if (phase === 'signal' && now - tShown >= LATE_MS) REACT.finish('late', LATE_MS);
  },
  press(ts) {
    if (phase === 'wait') {
      if (ts - tArm < 500) return;         // 준비 버튼을 누른 직후의 연속 터치는 무시
      REACT.finish('early', 0, true);
    } else if (phase === 'signal') {
      const rt = ts - tShown;
      if (rt < FALSE_MS) REACT.finish('early', rt, false);
      else REACT.finish('ok', Math.min(rt, LATE_MS - 0.001));
    }
  },
  finish(kind, rt, before) {
    B.on = false; B.armed = false;
    const res = { kind, rt, bad: kind === 'early' };
    const ui = { delay: 320, bad: kind !== 'ok' };
    if (kind === 'early') {
      res.key = 1e6; res.stat = null; res.chip = '실격'; res.text = '부정 출발 (실격)';
      ui.verdict = '부정 출발';
      ui.detail = before ? '주전자가 끓기 전에 눌렀습니다. 실격입니다.' : '신호 뒤 0.1초 안에 눌렀습니다. 예측으로 보고 실격입니다.';
      ui.stamp = '실격!'; ui.snd = 'over';
    } else if (kind === 'late') {
      res.key = LATE_MS; res.stat = LATE_MS; res.chip = '시간 초과'; res.text = '시간 초과';
      ui.verdict = '시간 초과'; ui.detail = '3초 안에 누르지 못했습니다.'; ui.snd = 'flood';
    } else {
      res.key = rt; res.stat = rt; res.chip = sec(rt); res.text = sec(rt) + '초';
      ui.verdict = sec(rt) + '초';
      if (rt < 200) { ui.detail = '번개 같은 손입니다.'; ui.stamp = '번개!'; ui.snd = 'perfect'; }
      else if (rt < 280) { ui.detail = '빠릅니다.'; ui.snd = 'close'; }
      else if (rt < 400) { ui.detail = '무난합니다.'; ui.snd = 'ok'; }
      else { ui.detail = '느긋합니다.'; ui.snd = 'meh'; }
    }
    endTurn(res, ui);
  },
  abort() {},
  icon: null,
  why: r => r.kind === 'early' ? '끓기 전에 눌러 실격했습니다.'
    : r.kind === 'late' ? '3초 안에 누르지 못했습니다.'
    : sec(r.rt) + '초로 가장 느렸습니다.',
  total: (P, avg) => '실격 ' + P.bad + '회 · ' + (P.cnt ? '평균 ' + sec(avg) + '초' : '기록 없음')
};
const MODS = { pour: POUR, react: REACT };

btnGo.addEventListener('click', go);
btnNext.addEventListener('click', next);
btnBig.addEventListener('pointerdown', e => { e.preventDefault(); if (G) G.mod.press(evTime(e)); });
btnBig.addEventListener('click', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (cur !== 'play' || e.repeat || !G) return;
  if ((e.code === 'Space' || e.code === 'Enter') && !btnBig.hidden) { e.preventDefault(); G.mod.press(evTime(e)); }
});
$('play').addEventListener('contextmenu', e => e.preventDefault());

// 그만하기: 한 번 더 눌러야 종료
function twoStepQuit(b) {
  let armed = 0;
  b.addEventListener('click', () => {
    if (Date.now() - armed < 3000) { armed = 0; b.textContent = '그만하기'; toSetup(); return; }
    armed = Date.now();
    b.textContent = '한 번 더 누르면 종료';
    setTimeout(() => { if (armed && Date.now() - armed >= 2900) { armed = 0; b.textContent = '그만하기'; } }, 3000);
  });
}
twoStepQuit($('btn-quit'));
twoStepQuit($('dcard-quit'));
function toSetup() {
  token++;
  phase = 'idle';
  dphase = 'idle';
  SFX.pourStop();
  G = null;
  DU = null;
  keys.clear();
  unwake();
  show('setup');
}

// 진행 중에 화면이 꺼지거나 앱을 벗어나면 그 차례(대결)를 다시 한다
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (cur === 'play' && G && ['count', 'pour', 'wait', 'signal'].includes(phase)) { G.mod.abort(); toReady(); }
    if (cur === 'duel' && DU && (dphase === 'count' || dphase === 'play')) duelReady('화면이 꺼져서 이 대결을 다시 합니다.');
  } else wake();
});

/* ───────── 게임 3 진행: 비행기 맞대결 ─────────
   둘이면 한 번 붙고 끝난다. 셋 이상이면 이긴 사람이 자리에 남아 다음 사람과 붙는 연승전이다. */
const DUEL_META = {
  title: '쏘고 피해!',
  rules: [
    '둘이 폰을 마주 잡고, 각자 자기 쪽 조종판을 좌우로 밀어 비행기를 움직입니다.',
    '미사일은 자동으로 나가고 점점 빨라집니다. 세 번 맞으면 집니다.',
    '3명 이상이면 이긴 사람이 남아 다음 사람과 붙는 연승전입니다.'
  ]
};
const dcv = $('dcv');
const pads = [$('pad-0'), $('pad-1')];
const keys = new Set();
const duelTally = { key: '', wins: {} };
let DS = mkDuel(false);                  // 지금 대결의 경기장 상태
let DU = null;                           // 연승전 전체 상태
let dphase = 'idle';                     // ready → count → play → over
let dReady = [false, false], tCountD = 0, dLast = 0, dAct = null;

function startDuel(names) {
  const n = names.length;
  const off = n > 2 ? gameSeq++ % n : 0;             // 둘이면 자리를 바꾸지 않는다
  const order = names.map((_, i) => names[(i + off) % n]);
  DU = { names: order, stats: order.map(() => ({ wins: 0, hits: 0, lost: 0 })), cur: [0, 1], next: 2, match: 1, champ: -1 };
  show('duel');
  wake();
  duelReady('');
}
function renderLives() {
  [0, 1].forEach(i => {
    $('lives-' + i).innerHTML = Array.from({ length: DUEL_LIVES }, (_, k2) => '<i class="life' + (k2 < DS.planes[i].lives ? '' : ' off') + '"></i>').join('');
  });
}
function duelMsg(top, bot) {
  [top, bot].forEach((txt, i) => {
    const el = $('dmsg-' + i);
    el.hidden = !txt;
    if (txt) el.textContent = txt;
  });
}
function duelCard(title, sub, label, fn) {
  $('dcard-title').textContent = title;
  $('dcard-sub').textContent = sub;
  const b = $('dcard-btn');
  b.hidden = !label;
  if (label) { b.textContent = label; dAct = fn; lockBriefly(b, 600); }
  $('dcard').hidden = false;
}
function duelReady(note) {
  token++;
  dphase = 'ready';
  DS = mkDuel(false);
  dReady = [false, false];
  [0, 1].forEach(i => {
    $('pname-' + i).textContent = DU.names[DU.cur[i]];
    $('phint-' + i).textContent = '여기에 손가락을 올리면 준비 완료';
    pads[i].classList.remove('ready', 'done');
  });
  duelMsg(null, null);
  renderLives();
  const n = DU.names.length;
  duelCard(n > 2 ? '대결 ' + DU.match + ' / ' + (n - 1) : DU.names[DU.cur[0]] + ' 대 ' + DU.names[DU.cur[1]],
    (note ? note + ' ' : '') + '둘 다 조종판에 손가락을 올리면 시작합니다.', null, null);
}
function duelSetReady(i) {
  if (dphase !== 'ready' || dReady[i]) return;
  dReady[i] = true;
  pads[i].classList.add('ready');
  $('phint-' + i).textContent = '준비 완료';
  SFX.init();
  SFX.click();
  if (dReady[0] && dReady[1]) {
    token++;
    dphase = 'count';
    tCountD = performance.now();
    dLast = 0;
    $('dcard').hidden = true;
    [0, 1].forEach(k2 => { $('phint-' + k2).textContent = '좌우로 밀어 조종'; });
    [0, 0.6, 1.2].forEach(at => SFX.tone(520, 0.09, { at, type: 'square', vol: 0.07 }));
    SFX.tone(1040, 0.16, { at: 1.8, type: 'square', vol: 0.07 });
  }
}
pads.forEach((pad, i) => {
  // 조종판과 경기장은 너비가 같아서 손가락 위치가 곧 비행기 위치다
  const steer = e => {
    const r = dcv.getBoundingClientRect();
    if (r.width > 0) DS.planes[i].tx = clamp((e.clientX - r.left) / r.width, 0, 1);
  };
  pad.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    steer(e);
    duelSetReady(i);
  });
  pad.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse' && !(e.buttons & 1)) return;
    steer(e);
  });
  pad.addEventListener('contextmenu', e => e.preventDefault());
});
$('dcard-btn').addEventListener('click', () => { if (dAct) dAct(); });
// 키보드(컴퓨터에서 할 때): 위쪽 A·D, 아래쪽 ←·→, 스페이스로 둘 다 준비
document.addEventListener('keydown', e => {
  if (cur !== 'duel') return;
  if (['KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight'].includes(e.code)) { keys.add(e.code); e.preventDefault(); }
  else if (e.code === 'Space' && dphase === 'ready') { e.preventDefault(); duelSetReady(0); duelSetReady(1); }
});
document.addEventListener('keyup', e => keys.delete(e.code));
function duelKeys() {
  [['KeyA', 'KeyD'], ['ArrowLeft', 'ArrowRight']].forEach(([l, r], i) => {
    const p = DS.planes[i];
    const dir = (keys.has(r) ? 1 : 0) - (keys.has(l) ? 1 : 0);
    if (dir) { p.tx = clamp(p.x + dir * 0.2, 0, 1); p.kb = true; }
    else if (p.kb) { p.tx = p.x; p.kb = false; }
  });
}
function duelUpdate(dt) {
  if (!DU) return;
  const W = dcv.clientWidth, H = dcv.clientHeight;
  if (!W || !H) return;
  duelKeys();
  if (dphase === 'count') {
    const el = performance.now() - tCountD;
    const n = 3 - Math.floor(el / 600);
    if (n !== dLast && n >= 1) { dLast = n; duelMsg(String(n), String(n)); }
    if (el >= 1800) { dphase = 'play'; duelMsg(null, null); }
  }
  if (dphase === 'play') {
    // 빠른 미사일이 비행기를 건너뛰지 않도록 잘게 나눠 계산한다
    const steps = Math.max(1, Math.ceil(dt * 120)), h = dt / steps;
    let fired = false, hit = false;
    for (let i = 0; i < steps; i++) {
      const ev = duelStep(DS, h, W, H);
      fired = fired || ev.fired;
      ev.hit.forEach(q => {
        hit = true;
        pads[q].classList.remove('hit'); void pads[q].offsetWidth; pads[q].classList.add('hit');
      });
      if (DS.planes[0].lives <= 0 || DS.planes[1].lives <= 0 || DS.t >= DUEL_LIMIT) {
        if (hit) { renderLives(); SFX.boom(); }
        duelOver();
        return;
      }
    }
    if (hit) { renderLives(); SFX.boom(); }
    else if (fired) SFX.shot();
  } else {
    duelMove(DS, dt, duelGeom(W, H));
    if (dphase === 'over') DS.t += dt;               // 폭발 그림이 끝까지 보이게 시간만 흘린다
  }
}
function duelOver() {
  token++;
  const my = token;
  dphase = 'over';
  const l = DS.planes.map(p => p.lives);
  const win = l[0] === l[1] ? -1 : (l[0] > l[1] ? 0 : 1);     // 동시에 격추되거나 시간 종료 때 목숨이 같으면 무승부
  const timeUp = l[0] > 0 && l[1] > 0;
  DS.shots.length = 0;
  [0, 1].forEach(i => {
    $('phint-' + i).textContent = win < 0 ? '무승부' : i === win ? '승리!' : '패배';
    pads[i].classList.add('done');
  });
  if (win < 0) duelMsg('무승부', '무승부');
  else {
    duelMsg(win === 0 ? '승리!' : '패배', win === 1 ? '승리!' : '패배');
    [0, 1].forEach(i => {
      const st = DU.stats[DU.cur[i]];
      st.hits += DS.planes[i].hits;
      st.lost += DUEL_LIVES - l[i];
    });
    DU.stats[DU.cur[win]].wins++;
    DU.champ = DU.cur[win];
    SFX.fanfare();
  }
  setTimeout(() => {
    if (my !== token) return;
    duelMsg(null, null);
    if (win < 0) {
      duelCard('무승부', timeUp ? DUEL_LIMIT + '초 동안 승부가 나지 않았습니다.' : '둘이 동시에 격추됐습니다.', '재대결', () => duelReady(''));
      return;
    }
    const wName = DU.names[DU.cur[win]];
    const how = timeUp ? '시간이 다 되어 남은 목숨이 많은 쪽이 이겼습니다. ' : '';
    if (DU.next < DU.names.length) {
      const nx = DU.next;
      duelCard(wName + ' 승리', how + '다음 상대는 ' + DU.names[nx] + '입니다. 진 사람 자리에 앉으세요.', '다음 대결', () => {
        DU.cur[1 - win] = nx; DU.next++; DU.match++;
        duelReady('');
      });
    } else {
      duelCard(wName + ' 승리', how + (DU.names.length > 2 ? '연승전이 끝났습니다.' : '목숨 ' + l[win] + '개를 남겼습니다.'), '결과 보기', duelFinal);
    }
  }, 900);
}
/* 최종 순위: 마지막 대결의 승자가 1등. 나머지는 승수, 명중 횟수, 덜 맞은 순. */
function duelFinal() {
  token++;
  dphase = 'idle';
  const n = DU.names.length;
  const arr = DU.names.map((name, i) => ({ name, wins: DU.stats[i].wins, hits: DU.stats[i].hits, lost: DU.stats[i].lost, champ: i === DU.champ ? 1 : 0 }))
    .sort((a, b) => b.champ - a.champ || b.wins - a.wins || b.hits - a.hits || a.lost - b.lost);
  assignRanks(arr, (a, b) => a.champ === b.champ && a.wins === b.wins && a.hits === b.hits && a.lost === b.lost);
  const lastRank = Math.max(...arr.map(r => r.rank));
  const losers = arr.filter(r => r.rank === lastRank);
  const lr = arr[arr.length - 1];

  $('res-eyebrow').textContent = DUEL_META.title + ' · 최종 결과' + (n > 2 ? ' · 연승전' : '');
  $('res-title').textContent = '1등 ' + arr[0].name;
  $('res-loser').hidden = false;
  $('loser-tag').textContent = losers.length > 1 ? '공동 꼴찌' : '꼴찌';
  $('loser-name').textContent = losers.map(r => r.name).join(', ');
  $('loser-why').textContent = n > 2 ? lr.wins + '승 · 명중 ' + lr.hits + '번'
    : lr.lost >= DUEL_LIVES ? '세 번 맞아 격추됐습니다.' : '남은 목숨이 더 적었습니다.';
  let sub = '마지막 대결의 승자가 1등이고, 나머지는 승수와 명중 횟수 순입니다.';
  if (n === 2) {
    const key = arr.map(r => r.name).sort().join('\u0001');
    if (duelTally.key !== key) { duelTally.key = key; duelTally.wins = {}; }
    duelTally.wins[arr[0].name] = (duelTally.wins[arr[0].name] || 0) + 1;
    const total = Object.values(duelTally.wins).reduce((a, b) => a + b, 0);
    sub = total > 1 ? '지금까지 ' + DU.names.map(nm => nm + ' ' + (duelTally.wins[nm] || 0) + '승').join(' · ') : '';
  }
  $('res-sub').textContent = sub;
  $('rank').innerHTML = arr.map(r => {
    const cls = 'rk nocup' + (r.rank === 1 ? ' first' : '') + (r.rank === lastRank ? ' last' : '');
    const detail = n > 2 ? r.wins + '승 · 명중 ' + r.hits + '번'
      : r.rank === 1 ? '남은 목숨 ' + (DUEL_LIVES - r.lost) + '개 · 명중 ' + r.hits + '번' : '명중 ' + r.hits + '번';
    return '<li class="' + cls + '"><span class="pos">' + r.rank + '</span>'
      + '<span class="who2"><span class="nm">' + esc(r.name) + '</span><span class="sub">' + detail + '</span></span>'
      + '<span class="val"><b>' + r.rank + '등</b></span></li>';
  }).join('');
  const names = DU.names.slice(), tieNames = losers.map(r => r.name);
  setActions('같은 멤버로 한 판 더', () => startDuel(names),
    losers.length > 1 ? '꼴찌 결정전 (' + tieNames.length + '명)' : null,
    () => startDuel(tieNames), true);
  show('result');
  SFX.fanfare();
}

/* ───────── 결과 ───────── */
let svgSeq = 0;
function miniCup(h, target) {
  const id = 'mc' + (++svgSeq);
  const y = (40 - 35 * clamp(h, 0, 1)).toFixed(1), ty = (40 - 35 * target).toFixed(1);
  const cup = '5,5 35,5 30.5,40 9.5,40';
  return '<svg class="mini" viewBox="0 0 40 44" aria-hidden="true">'
    + '<defs><clipPath id="' + id + '"><polygon points="' + cup + '"/></clipPath></defs>'
    + '<polygon points="' + cup + '" fill="var(--cup-in)"/>'
    + '<rect clip-path="url(#' + id + ')" x="0" y="' + y + '" width="40" height="44" fill="var(--coffee)"/>'
    + '<line x1="6" x2="34" y1="' + ty + '" y2="' + ty + '" stroke="var(--ink)" stroke-width="3"/>'
    + '<line x1="6" x2="34" y1="' + ty + '" y2="' + ty + '" stroke="var(--dash)" stroke-width="1.5" stroke-dasharray="3 2.4"/>'
    + '<polygon points="' + cup + '" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>'
    + '<rect x="3" y="3" width="34" height="4.6" rx="2.3" fill="var(--cup)" stroke="var(--ink)" stroke-width="1.8"/>'
    + '</svg>';
}
function roundRow(r, showPts, lastRank) {
  const P = G.players[r.p];
  const icon = G.mod.icon ? G.mod.icon(r) : '';
  const cls = 'rk' + (icon ? '' : ' nocup') + (r.rank === 1 ? ' first' : '') + (lastRank && r.rank === lastRank ? ' last' : '');
  const val = showPts
    ? '<span class="val"><b>+' + r.pts + '</b><small>누적 ' + P.pts + '점</small></span>'
    : '<span class="val"><b>' + r.rank + '등</b></span>';
  return '<li class="' + cls + '"><span class="pos">' + r.rank + '</span>' + icon
    + '<span class="who2"><span class="nm">' + esc(P.name) + '</span><span class="sub' + (r.bad ? ' bad' : '') + '">' + esc(r.text) + '</span></span>'
    + val + '</li>';
}
function endRound() {
  token++;
  phase = 'idle';
  const n = G.players.length;
  const ranked = rankRound(G.results);
  ranked.forEach(r => {
    const P = G.players[r.p];
    r.pts = n - r.rank + 1;
    P.pts += r.pts;
    P.bad += r.bad ? 1 : 0;
    if (r.stat !== null) { P.sum += r.stat; P.cnt++; }
  });
  G.r++;
  if (G.r >= G.rounds) { showFinal(ranked); return; }

  $('res-eyebrow').textContent = G.mod.title + ' · ' + G.r + '판 / ' + G.rounds + '판';
  $('res-title').textContent = G.r + '판 결과';
  $('res-loser').hidden = true;
  $('res-sub').textContent = '등수만큼 점수를 받습니다. 1등 ' + n + '점, 꼴찌 1점.';
  $('rank').innerHTML = ranked.map(r => roundRow(r, true, 0)).join('');
  setActions((G.r + 1) + '판 시작', startRound, null, null, false);
  show('result');
  SFX.close();
}
function showFinal(ranked) {
  const n = G.players.length;
  const multi = G.rounds > 1;
  let rows, lastRank, losers, firsts, why;
  if (!multi) {
    lastRank = Math.max(...ranked.map(r => r.rank));
    losers = ranked.filter(r => r.rank === lastRank).map(r => r.p);
    firsts = ranked.filter(r => r.rank === 1).map(r => r.p);
    why = G.mod.why(ranked[ranked.length - 1]);
    rows = ranked.map(r => roundRow(r, false, losers.length === n ? 0 : lastRank)).join('');
  } else {
    const tot = G.players.map((P, i) => ({ p: i, pts: P.pts, bad: P.bad, avg: P.cnt ? P.sum / P.cnt : Infinity }))
      .sort((a, b) => b.pts - a.pts || a.bad - b.bad || (a.avg === b.avg ? 0 : a.avg - b.avg));
    assignRanks(tot, (a, b) => a.pts === b.pts && a.bad === b.bad && (a.avg === b.avg || Math.abs(a.avg - b.avg) < 1e-7));
    lastRank = Math.max(...tot.map(r => r.rank));
    losers = tot.filter(r => r.rank === lastRank).map(r => r.p);
    firsts = tot.filter(r => r.rank === 1).map(r => r.p);
    why = G.rounds + '판 합계 ' + tot[tot.length - 1].pts + '점';
    rows = tot.map(r => {
      const P = G.players[r.p];
      const cls = 'rk nocup' + (r.rank === 1 ? ' first' : '') + (r.rank === lastRank && losers.length < n ? ' last' : '');
      return '<li class="' + cls + '"><span class="pos">' + r.rank + '</span>'
        + '<span class="who2"><span class="nm">' + esc(P.name) + '</span><span class="sub">' + esc(G.mod.total(P, r.avg)) + '</span></span>'
        + '<span class="val"><b>' + r.pts + '점</b></span></li>';
    }).join('');
  }
  const allTied = losers.length === n;
  const nameOf = p => G.players[p].name;
  $('res-eyebrow').textContent = G.mod.title + ' · 최종 결과' + (multi ? ' · ' + G.rounds + '판 합계' : '');
  $('res-loser').hidden = false;
  if (allTied) {
    $('res-title').textContent = '승부를 가리지 못했습니다';
    $('loser-tag').textContent = '전원 동점';
    $('loser-name').textContent = '무승부';
    $('loser-why').textContent = '결정전으로 다시 겨루세요.';
    $('res-sub').textContent = '';
  } else {
    $('res-title').textContent = '1등 ' + firsts.map(nameOf).join(', ');
    $('loser-tag').textContent = losers.length > 1 ? '공동 꼴찌' : '꼴찌';
    $('loser-name').textContent = losers.map(nameOf).join(', ');
    $('loser-why').textContent = why;
    $('res-sub').textContent = multi ? G.mod.tieNote : '';
  }
  $('rank').innerHTML = rows;
  const game = G.game, names = G.players.map(P => P.name), rounds = G.rounds, opts = G.opts;
  const tieNames = losers.map(nameOf);
  setActions('같은 멤버로 한 판 더', () => newGame(game, names, rounds, opts),
    losers.length > 1 ? '꼴찌 결정전 (' + tieNames.length + '명, 1판)' : null,
    () => newGame(game, tieNames, 1, opts), true);
  show('result');
  SFX.fanfare();
}
let actA = null, actC = null;
function setActions(labelA, fnA, labelC, fnC, showHome) {
  $('btn-a').textContent = labelA; actA = fnA;
  $('btn-c').hidden = !labelC;
  if (labelC) { $('btn-c').textContent = labelC; actC = fnC; }
  $('btn-b').hidden = !showHome;
  token++;
  lockBriefly($('btn-a'), 500);
}
$('btn-a').addEventListener('click', () => { if (actA) actA(); });
$('btn-c').addEventListener('click', () => { if (actC) actC(); });
$('btn-b').addEventListener('click', toSetup);

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  SFX.on = cfg.sfx;
  SFX.init();
  const names = Array.from({ length: cfg.n }, (_, i) => (cfg.names[i] || '').trim() || (i + 1) + '번');
  if (cfg.game === 'duel') startDuel(names);
  else newGame(cfg.game, names, cfg.rounds, { irr: cfg.irr, blind: cfg.blind });
});

/* ───────── 게임 선택과 시범 장면 ───────── */
const META = { pour: POUR, react: REACT, duel: DUEL_META };
function applyGame() {
  const mod = META[cfg.game];
  $('game-' + cfg.game).checked = true;
  $('game-title').textContent = mod.title;
  $('rules').innerHTML = mod.rules.map(x => '<li>' + esc(x) + '</li>').join('');
  document.querySelectorAll('.only-pour').forEach(el => { el.hidden = cfg.game !== 'pour'; });
  document.querySelectorAll('.no-duel').forEach(el => { el.hidden = cfg.game === 'duel'; });
}
document.querySelectorAll('input[name="game"]').forEach(r => r.addEventListener('change', () => {
  if (!r.checked) return;
  cfg.game = r.value; save(); applyGame();
}));
applyGame();

// 따르기 시범: 목표선에 딱 멈추는 모습을 되풀이한다
const D = mkScene();
D.target = 0.72;
let dPh = 0, dClock = 0, dV = 0;
if (reduceMotion) { D.h = D.target - 0.006; D.steamOn = true; }
function demoPour(dt) {
  if (reduceMotion) return;
  dClock += dt;
  if (dPh === 0) {                                   // 주전자 기울이기
    D.tiltGoal = 1; D.steamOn = false;
    if (dClock > 0.55) { dPh = 1; dClock = 0; D.streamOn = true; }
  } else if (dPh === 1) {                            // 줄기가 컵에 닿기까지
    if (D.sHead >= 1) { dPh = 2; dClock = 0; dV = 0; D.pouring = true; }
  } else if (dPh === 2) {                            // 따르기
    dV += dt / 3.4;
    D.h = hFromV(dV);
    if (D.h >= D.target - 0.006) { dPh = 3; dClock = 0; D.pouring = false; D.streamOn = false; D.tiltGoal = 0; D.steamOn = true; }
  } else if (dPh === 3) {                            // 딱 멈춘 모습 보여 주기
    if (dClock > 2.2) { dPh = 4; dClock = 0; D.steamOn = false; D.drain = true; }
  } else if (D.h <= 0) { D.drain = false; dPh = 0; dClock = 0; }
}
// 끓이기 시범: 기다리다가 끓어오르는 모습을 되풀이한다
const BD = mkBoil();
BD.armed = true; BD.heat = 1;
let bClock = 0;
function demoBoil(dt) {
  if (reduceMotion) return;
  bClock += dt;
  BD.on = bClock % 4.2 > 2.6;
}
// 맞대결 시범: 두 비행기가 알아서 오가며 쏜다(맞아도 닳지 않는다)
const DD = mkDuel(true);
DD.planes[0].x = DD.planes[0].tx = 0.34;
DD.planes[1].x = DD.planes[1].tx = 0.66;
function demoDuel(dt, t, W, H) {
  if (reduceMotion || !W || !H) return;
  DD.planes[0].tx = 0.5 + 0.34 * Math.sin(t * 1.1) + 0.07 * Math.sin(t * 2.9);
  DD.planes[1].tx = 0.5 + 0.34 * Math.sin(t * 0.9 + 2.2) + 0.07 * Math.sin(t * 3.3);
  duelStep(DD, dt, W, H);
}

/* ───────── 루프 ───────── */
readTokens();
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', readTokens);
}
try { new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(readTokens).catch(() => {});

const heroCv = $('hero'), cv = $('cv');
let lastT = 0;
function frame(ts) {
  const t = ts / 1000;
  const dt = clamp(t - lastT, 0, 0.05);
  lastT = t;
  if (cur === 'setup') {
    if (cfg.game === 'pour') { demoPour(dt); tickScene(D, dt); paint(heroCv, drawPour, D, t, dt); }
    else if (cfg.game === 'react') { demoBoil(dt); tickBoil(BD, dt); paint(heroCv, drawBoil, BD, t, dt); }
    else { demoDuel(dt, t, heroCv.clientWidth, heroCv.clientHeight); paint(heroCv, drawDuel, DD, t, dt); }
  } else if (cur === 'duel') {
    duelUpdate(dt);
    paint(dcv, drawDuel, DS, t, dt);
  } else if (cur === 'play' && G) {
    const mod = G.mod;
    mod.update(performance.now());
    mod.tick(mod.scene, dt);
    paint(cv, mod.draw, mod.scene, t, dt);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
