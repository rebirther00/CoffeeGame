<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선 넘지 마 커피</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FFD02E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위는 무대(주전자와 종이컵), 아래는 엄지로 누르는 조작 패널. 한 화면에 고정한다. */
:root {
  --bg: #FFD02E;
  --fg: #2A1509;
  --muted: #6A4A12;
  --surface: #FFF7E0;
  --surface-fg: #2A1509;
  --line: #2A1509;
  --shadow: #2A1509;
  --primary: #2A1509;
  --primary-fg: #FFE07A;
  --danger: #D7301B;
  --danger-fg: #FFFFFF;
  --danger-text: #BD2410;
  --good: #1E7F50;
  --focus: #1B46D1;
  --stage: #FFE789;
  --table: #F0AE1A;
  /* 무대 그림 색 */
  --ink: #2A1509;
  --cup: #FFFFFF;
  --cup-in: #F1E7D3;
  --coffee: #57300F;
  --crema: #C8904C;
  --kettle: #D7301B;
  --kettle-dk: #A9200E;
  --sleeve: #CBA063;
  --dash: #FFD02E;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #20130B;
    --fg: #FCEFD3;
    --muted: #CDB48A;
    --surface: #36210F;
    --surface-fg: #FCEFD3;
    --line: #0B0503;
    --shadow: #0B0503;
    --primary: #FFD02E;
    --primary-fg: #2A1509;
    --danger: #E4442E;
    --danger-fg: #FFFFFF;
    --danger-text: #FF8A73;
    --good: #2FA36B;
    --focus: #9CB8FF;
    --stage: #F6C62C;
    --table: #D9990F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #20130B;
  --fg: #FCEFD3;
  --muted: #CDB48A;
  --surface: #36210F;
  --surface-fg: #FCEFD3;
  --line: #0B0503;
  --shadow: #0B0503;
  --primary: #FFD02E;
  --primary-fg: #2A1509;
  --danger: #E4442E;
  --danger-fg: #FFFFFF;
  --danger-text: #FF8A73;
  --good: #2FA36B;
  --focus: #9CB8FF;
  --stage: #F6C62C;
  --table: #D9990F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 500 15px/1.45 var(--font-body);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: manipulation;
}
#app {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { height: 100%; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
p, h1, h2, ol, ul { margin: 0; padding: 0; }
ol, ul { list-style: none; }

/* 공통 버튼 */
.btn {
  appearance: none;
  border: 2.5px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  color: var(--surface-fg);
  font: 700 16px/1.2 var(--font-body);
  padding: 12px 16px;
  box-shadow: 0 4px 0 var(--shadow);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .06s, box-shadow .06s, opacity .15s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.btn:focus-visible, .link:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.btn[disabled] { opacity: .5; }
.btn.primary { background: var(--primary); color: var(--primary-fg); }
.btn.big { width: 100%; font: 400 24px/1.15 var(--font-display); padding: 15px 18px; letter-spacing: .01em; }
.link {
  appearance: none; border: 0; background: none; color: var(--muted);
  font: 500 13px/1.2 var(--font-body); padding: 6px 2px; text-decoration: underline; cursor: pointer;
}
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }

/* 무대 */
.stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  border: 2.5px solid var(--line);
  border-radius: 22px;
  background: var(--stage);
  box-shadow: 0 4px 0 var(--shadow);
  overflow: hidden;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* 설정 화면 */
#setup { overflow-y: auto; gap: 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
.brand h1 {
  align-self: flex-start;
  font: 400 46px/1.1 var(--font-display);
  padding-bottom: 6px;
  border-bottom: 5px dashed var(--danger);
}
.stage.hero { flex: 0 0 auto; height: 190px; height: clamp(160px, 27vh, 230px); }
.rules { display: flex; flex-direction: column; gap: 3px; font-size: 14px; }
.rules li { padding-left: 18px; position: relative; }
.rules li::before { content: ""; position: absolute; left: 0; top: .7em; width: 11px; border-top: 2.5px dashed var(--danger); }
.opts {
  display: flex; flex-direction: column; gap: 6px;
  background: var(--surface); color: var(--surface-fg);
  border: 2.5px solid var(--line); border-radius: 20px;
  padding: 10px 14px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.row + .row, .names + .row { border-top: 1.5px dashed color-mix(in srgb, var(--surface-fg) 28%, transparent); }
.label { font-weight: 700; display: flex; flex-direction: column; min-width: 0; }
.label small { font-weight: 400; font-size: 12.5px; opacity: .75; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button {
  appearance: none; width: 42px; height: 42px; border-radius: 50%;
  border: 2.5px solid var(--line); background: var(--bg); color: var(--fg);
  font: 700 22px/1 var(--font-body); cursor: pointer; box-shadow: 0 3px 0 var(--shadow);
}
.stepper button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.stepper button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.stepper output { min-width: 3.2em; text-align: center; font: 400 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 0 10px; }
.name {
  display: flex; align-items: center; gap: 6px; min-width: 0;
  border: 2px solid var(--line); border-radius: 12px; padding: 0 8px 0 10px;
  background: color-mix(in srgb, var(--surface) 70%, var(--bg));
}
.name span { font: 400 16px/1 var(--font-display); opacity: .6; }
.name input {
  flex: 1 1 auto; min-width: 0; width: 100%; height: 40px; border: 0; background: transparent; color: inherit;
  font: 500 16px/1 var(--font-body); -webkit-user-select: text; user-select: text; outline: none;
}
.name:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.seg { flex: 0 0 auto; display: flex; border: 2.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 8px 14px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.seg label + label span { border-left: 2.5px solid var(--line); }
.seg input:checked + span { background: var(--primary); color: var(--primary-fg); }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: -4px; }
.toggle { cursor: pointer; position: relative; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle i {
  flex: 0 0 auto; position: relative; width: 54px; height: 31px;
  border: 2.5px solid var(--line); border-radius: 999px;
  background: color-mix(in srgb, var(--surface-fg) 16%, var(--surface));
  transition: background .15s;
}
.toggle i::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface-fg); transition: transform .15s;
}
.toggle input:checked + i { background: var(--good); }
.toggle input:checked + i::after { transform: translateX(23px); background: #FFFFFF; }
.toggle input:focus-visible + i { outline: 3px solid var(--focus); outline-offset: 2px; }
.start { position: sticky; bottom: 0; padding: 8px 0 8px; margin-top: 4px; background: var(--bg); }

/* 게임 화면 */
.hud { display: flex; flex-direction: column; gap: 6px; }
.hud-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#hud-round { font: 400 22px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; display: flex; gap: 6px; align-items: baseline;
  border: 2px solid var(--line); border-radius: 999px; padding: 3px 11px;
  background: var(--surface); color: var(--surface-fg); font-size: 13px; font-weight: 700;
}
.chip b { font-weight: 500; font-variant-numeric: tabular-nums; }
.chip.over b { color: var(--danger-text); font-weight: 700; }
.chip.todo { background: transparent; color: var(--muted); border-style: dashed; border-color: var(--muted); }
.chip.now { background: var(--primary); color: var(--primary-fg); }
.count {
  position: absolute; left: 20px; top: 8px;
  font: 400 104px/1 var(--font-display); color: var(--ink); pointer-events: none;
}
.count.pop { animation: pop .5s ease-out both; }
.stamp {
  position: absolute; left: 14px; top: 16px; transform: rotate(-7deg);
  font: 400 30px/1.1 var(--font-display); padding: 6px 14px 4px;
  border: 2.5px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink);
  background: var(--cup); color: var(--kettle); pointer-events: none;
  animation: stamp .28s cubic-bezier(.2, 1.6, .4, 1) both;
}
.stamp.good { background: var(--ink); color: var(--dash); }
@keyframes pop { from { transform: scale(1.5); opacity: 0; } 30% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
@keyframes stamp { from { transform: rotate(-7deg) scale(2.2); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: 1; } }
.panel { flex: 0 0 auto; height: 176px; }
.pane { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding-bottom: 5px; }
.who { font: 400 34px/1.1 var(--font-display); overflow-wrap: anywhere; }
.who small { font: 400 22px/1 var(--font-display); opacity: .7; }
.hint { font-size: 14px; color: var(--muted); }
.btn.stop {
  width: 100%; height: calc(100% - 9px);
  border-radius: 26px; border-width: 3px;
  background: var(--danger); color: var(--danger-fg);
  font: 400 62px/1 var(--font-display);
  box-shadow: 0 8px 0 var(--shadow);
  touch-action: none;
}
.btn.stop:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--shadow); }
.btn.stop.wait { background: color-mix(in srgb, var(--danger) 45%, var(--bg)); font-size: 34px; }
.verdict { font: 400 30px/1.1 var(--font-display); }
.verdict.bad { color: var(--danger-text); }
.detail { font-size: 14.5px; font-variant-numeric: tabular-nums; }

/* 결과 화면 */
#result { overflow-y: auto; }
.res-head { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.res-head h2 { font: 400 34px/1.15 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; }
.loser {
  align-self: flex-start; display: flex; flex-direction: column; gap: 2px; max-width: 100%;
  background: var(--danger); color: var(--danger-fg);
  border: 2.5px solid var(--line); border-radius: 18px; box-shadow: 0 5px 0 var(--shadow);
  padding: 10px 18px 12px; transform: rotate(-1.5deg); margin: 6px 0 4px;
}
.loser .tag { font-size: 13px; font-weight: 700; letter-spacing: .12em; }
.loser strong { font: 400 44px/1.1 var(--font-display); overflow-wrap: anywhere; }
.loser .why { font-size: 14px; }
.rank { display: flex; flex-direction: column; gap: 8px; }
.rk {
  display: grid; grid-template-columns: 34px auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  background: var(--surface); color: var(--surface-fg);
  border: 2.5px solid var(--line); border-radius: 16px; padding: 8px 14px 8px 10px;
}
.rk.nocup { grid-template-columns: 34px minmax(0, 1fr) auto; }
.rk .pos {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid var(--line); font: 400 18px/1 var(--font-display); padding-top: 2px;
  background: color-mix(in srgb, var(--surface-fg) 10%, var(--surface));
}
.rk.first .pos { background: var(--dash); color: var(--ink); }
.rk.last { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger); }
.rk.last .pos { background: var(--danger); color: var(--danger-fg); }
.mini { width: 36px; height: 40px; display: block; }
.rk .who2 { min-width: 0; display: flex; flex-direction: column; }
.rk .nm { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.rk .sub { font-size: 12.5px; opacity: .78; font-variant-numeric: tabular-nums; }
.rk .sub.bad { color: var(--danger-text); opacity: 1; font-weight: 700; }
.rk .val { text-align: right; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; }
.rk .val b { font: 400 22px/1.1 var(--font-display); }
.rk .val small { font-size: 12px; opacity: .78; }
.actions { margin-top: auto; position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 8px 0 8px; background: var(--bg); }
.actions .btn:not(.big) { width: 100%; }

@media (max-height: 620px) {
  .panel { height: 150px; }
  .btn.stop { font-size: 50px; }
  .who { font-size: 28px; }
  .brand h1 { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) {
  .count.pop, .stamp { animation: none; }
  .btn, .toggle i, .toggle i::after { transition: none; }
}
</style>
</head>
<body>
<div id="app">

  <!-- 설정 -->
  <section id="setup" class="screen">
    <header class="brand">
      <p class="eyebrow">종이컵 커피 따르기 내기</p>
      <h1>선 넘지 마!</h1>
    </header>
    <div class="stage hero"><canvas id="hero" aria-hidden="true"></canvas></div>
    <ul class="rules">
      <li>돌아가며 한 번씩, 따라지는 커피를 버튼으로 멈춥니다.</li>
      <li>목표선에 가까울수록 순위가 높습니다.</li>
      <li>선을 넘기면 무조건 하위, 많이 넘길수록 더 아래입니다.</li>
    </ul>
    <form id="form" autocomplete="off">
      <div class="opts">
        <div class="row">
          <span class="label" id="lb-n">인원</span>
          <div class="stepper" role="group" aria-labelledby="lb-n">
            <button type="button" id="n-dec" aria-label="인원 줄이기">−</button>
            <output id="n-out" aria-live="polite">3명</output>
            <button type="button" id="n-inc" aria-label="인원 늘리기">+</button>
          </div>
        </div>
        <div id="names" class="names"></div>
        <div class="row">
          <span class="label" id="lb-r">판 수<small>여러 판이면 순위 점수를 합산합니다</small></span>
          <div class="seg" role="radiogroup" aria-labelledby="lb-r">
            <label><input type="radio" name="rounds" id="rounds-1" value="1"><span>1판</span></label>
            <label><input type="radio" name="rounds" id="rounds-3" value="3"><span>3판</span></label>
            <label><input type="radio" name="rounds" id="rounds-5" value="5"><span>5판</span></label>
          </div>
        </div>
        <label class="row toggle" for="opt-irr">
          <span class="label">속도 불규칙<small>커피 줄기가 빨라졌다 느려집니다</small></span>
          <input type="checkbox" id="opt-irr"><i></i>
        </label>
        <label class="row toggle" for="opt-blind">
          <span class="label">블라인드 구간<small>목표선 근처 수위를 컵홀더로 가립니다</small></span>
          <input type="checkbox" id="opt-blind"><i></i>
        </label>
        <label class="row toggle" for="opt-sfx">
          <span class="label">효과음·진동</span>
          <input type="checkbox" id="opt-sfx"><i></i>
        </label>
      </div>
      <div class="start"><button type="submit" class="btn primary big" id="btn-start">게임 시작</button></div>
    </form>
  </section>

  <!-- 게임 -->
  <section id="play" class="screen" hidden>
    <header class="hud">
      <div class="hud-top">
        <span id="hud-round">1판</span>
        <button type="button" class="link" id="btn-quit">그만하기</button>
      </div>
      <ol id="chips" class="chips"></ol>
    </header>
    <div class="stage" id="stage">
      <canvas id="cv" aria-hidden="true"></canvas>
      <div id="count" class="count" hidden></div>
      <div id="stamp" class="stamp" hidden></div>
    </div>
    <div class="panel">
      <div id="p-ready" class="pane">
        <p class="who"><span id="who-name">1번</span> <small>차례</small></p>
        <p class="hint" id="who-hint">폰을 넘겨받았으면 시작하세요.</p>
        <button type="button" class="btn primary big" id="btn-go">따르기 시작</button>
      </div>
      <button type="button" class="btn stop wait" id="btn-stop" hidden>준비</button>
      <div id="p-done" class="pane" hidden aria-live="polite">
        <p class="verdict" id="verdict"></p>
        <p class="detail" id="detail"></p>
        <button type="button" class="btn primary big" id="btn-next">다음</button>
      </div>
    </div>
  </section>

  <!-- 결과 -->
  <section id="result" class="screen" hidden>
    <header class="res-head">
      <p class="eyebrow" id="res-eyebrow"></p>
      <h2 id="res-title"></h2>
      <div class="loser" id="res-loser" hidden>
        <span class="tag" id="loser-tag">꼴찌</span>
        <strong id="loser-name"></strong>
        <span class="why" id="loser-why"></span>
      </div>
      <p id="res-sub"></p>
    </header>
    <ol id="rank" class="rank"></ol>
    <div class="actions">
      <button type="button" class="btn primary big" id="btn-a"></button>
      <button type="button" class="btn" id="btn-c" hidden></button>
      <button type="button" class="btn" id="btn-b" hidden>처음으로</button>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
document.documentElement.lang = 'ko';

/* ───────── 유틸 ───────── */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const rand = (a, b) => a + Math.random() * (b - a);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── 컵 모형 ─────────
   종이컵은 위가 넓은 원뿔대라서 같은 양을 부어도 위로 갈수록 수위가 천천히 오른다.
   부피 비율 v(0~1)를 높이 비율 h(0~1)로 바꾼다. */
const CUP_K = 0.40;                      // (윗지름 / 아랫지름) - 1
const CUP_MM = 75;                       // 화면에 표시하는 컵 안쪽 높이(mm)
const V_FULL = 1 + CUP_K + CUP_K * CUP_K / 3;
function hFromV(v) {
  const y = clamp(v, 0, 1) * V_FULL;
  let h = clamp(v, 0, 1);
  for (let i = 0; i < 8; i++) {
    const f = h + CUP_K * h * h + CUP_K * CUP_K * h * h * h / 3 - y;
    const d = 1 + 2 * CUP_K * h + CUP_K * CUP_K * h * h;
    h -= f / d;
  }
  return clamp(h, 0, 1);
}

/* 한 판의 조건: 목표선과 따르는 속도. 그 판의 모든 사람이 같은 조건으로 겨룬다. */
function makeRound(opts) {
  const target = rand(0.50, 0.86);
  const T = rand(3.0, 5.0);              // 기준 속도로 컵이 가득 차는 시간(초)
  const pr = opts.irr ? {
    a1: rand(0.32, 0.50), f1: rand(0.30, 0.62), p1: rand(0, TAU),

    ? clamp(1 + pr.a1 * Math.sin(TAU * pr.f1 * t + pr.p1) + pr.a2 * Math.sin(TAU * pr.f2 * t + pr.p2), 0.4, 1.8)

  while (v < 1 && i < 30000) {

    cum.push(v);

  const brim = (i - 1 + (1 - prev) / Math.max(1e-9, cum[i] - prev)) / 1000;   // 가득 차는 시각(초)

/* 한 판의 순위: 안 넘긴 사람이 먼저(선에 가까운 순), 넘긴 사람은 그 아래(덜 넘긴 순). */

}

const SFX = {
  on: true, ac: null, noise: null, pour: null,
  init() {
    if (!this.on) return null;
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ac = new AC();
      }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) { this.ac = null; }

  },
  tone(freq, dur, o) {
    const ac = this.init();
    if (!ac) return;

      const t = ac.currentTime + (o.at || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.18, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t); osc.stop(t + dur + 0.04);
    } catch (e) {}
  },
  pourStart() {
    const ac = this.init();
    if (!ac || this.pour) return;
    try {
      if (!this.noise) {
        const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = b.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        this.noise = b;
      }
      const src = ac.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 360; bp.Q.value = 1.1;
      const g = ac.createGain();
      g.gain.value = 0.0001;
      src.connect(bp); bp.connect(g); g.connect(ac.destination);
      src.start();
      g.gain.setTargetAtTime(0.2, ac.currentTime, 0.04);
      this.pour = { src, bp, g };
    } catch (e) { this.pour = null; }
  },
  // 컵이 찰수록 소리가 높아진다. 블라인드 구간에서는 이 소리가 유일한 단서다.
  pourSet(h, m) {
    const p = this.pour;
    if (!p) return;
    try {
      const t = this.ac.currentTime;
      p.bp.frequency.setTargetAtTime(360 + 500 * h + 1500 * h * h, t, 0.05);
      p.g.gain.setTargetAtTime(0.09 + 0.14 * m, t, 0.05);
    } catch (e) {}
  },
  pourStop() {
    const p = this.pour;
    if (!p) return;
    this.pour = null;
    try {
      const t = this.ac.currentTime;
      p.g.gain.cancelScheduledValues(t);
      p.g.gain.setTargetAtTime(0.0001, t, 0.02);
      p.src.stop(t + 0.2);
    } catch (e) {}
  },
  buzz(pattern) {
    if (!this.on) return;
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  },
  click() { this.tone(1500, 0.05, { type: 'square', vol: 0.08 }); this.buzz(18); },
  perfect() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.22, { at: i * 0.09, type: 'triangle', vol: 0.2 })); this.buzz([15, 40, 15, 40, 30]); },
  close() { this.tone(660, 0.16, { type: 'triangle' }); this.tone(880, 0.26, { at: 0.13, type: 'triangle' }); },
  ok() { this.tone(520, 0.2, { type: 'triangle', vol: 0.14 }); },
  early() { this.tone(330, 0.22, { type: 'triangle', vol: 0.14, to: 260 }); },
  over() { this.tone(300, 0.5, { type: 'sawtooth', vol: 0.14, to: 110 }); this.buzz([90, 50, 140]); },
  flood() { this.tone(260, 0.8, { type: 'sawtooth', vol: 0.16, to: 70 }); this.buzz([120, 60, 120, 60, 260]); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i === 3 ? 0.5 : 0.16, { at: i * 0.14, type: 'triangle', vol: 0.2 })); }
};

/* ───────── 무대 그리기 ───────── */
const COL = {};

  const cs = getComputedStyle(document.documentElement);

  COL.ink = g('--ink'); COL.cup = g('--cup'); COL.cupIn = g('--cup-in');
  COL.coffee = g('--coffee'); COL.crema = g('--crema');
  COL.kettle = g('--kettle'); COL.kettleDk = g('--kettle-dk');
  COL.sleeve = g('--sleeve'); COL.dash = g('--dash'); COL.table = g('--table');
  FONT_BODY = getComputedStyle(document.body).fontFamily || 'sans-serif';
}

function mkScene() {
  return {
    h: 0, target: 0.7, tilt: 0, tiltGoal: 0,
    streamOn: false, sHead: 0, sTail: 0, mult: 1, pouring: false, wave: 0,
    sleeve: 0, sleeveGoal: 0, spill: 0, spillOn: false, steam: 0, steamOn: false,
    drain: false, parts: []

}
function tickScene(s, dt) {
  s.tilt += (s.tiltGoal - s.tilt) * (1 - Math.exp(-dt * 10));
  if (s.streamOn) { s.sTail = 0; s.sHead = Math.min(1, s.sHead + dt / 0.22); }
  else if (s.sHead > 0) {
    s.sTail = Math.min(1, s.sTail + dt / 0.16);
    if (s.sTail >= 1) { s.sHead = 0; s.sTail = 0; }
  }
  s.wave += ((s.pouring ? 1 : 0) - s.wave) * (1 - Math.exp(-dt * (s.pouring ? 12 : 3)));
  s.sleeve += (s.sleeveGoal - s.sleeve) * (1 - Math.exp(-dt * 7));
  s.spill = s.spillOn ? Math.min(1, s.spill + dt / 0.9) : 0;
  s.steam += ((s.steamOn ? 1 : 0) - s.steam) * (1 - Math.exp(-dt * 3));
  if (s.drain && s.h > 0) s.h = Math.max(0, s.h - dt * 3);

function drawScene(ctx, W, H, s, t, dt) {

  const cx = W * 0.42;

  const rimH = ch * 0.055;
  const floorY = tableY - ch * 0.05;
  const rimY = top + rimH * 0.6;

  const cupPath = () => {
    ctx.beginPath();
    ctx.moveTo(cx - tw / 2, top); ctx.lineTo(cx + tw / 2, top);
    ctx.lineTo(cx + bw / 2, tableY); ctx.lineTo(cx - bw / 2, tableY);
    ctx.closePath();

    ctx.strokeStyle = c.crema; ctx.lineWidth = Math.max(1, sw * 0.22); ctx.globalAlpha = 0.7;

    s.parts.push({
      x: land.x, y: surfY,

      vy: -(0.5 + Math.random() * 0.8) * ch * 0.9,
      r: (0.6 + Math.random()) * lw * 0.7

  ctx.setLineDash([]);

  ctx.fillStyle = c.kettle; ctx.strokeStyle = c.ink; ctx.lineWidth = lw * 0.7;
  [-1, 1].forEach(side => {
    const x0 = cx + side * (thw + lw * 1.6);
    ctx.beginPath();
    ctx.moveTo(x0, ty); ctx.lineTo(x0 + side * ms * 1.5, ty - ms); ctx.lineTo(x0 + side * ms * 1.5, ty + ms);

function paint(canvas, s, t, dt) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
  if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawScene(ctx, w, h, s, t, dt);
}

function gameUpdate() {
  if (!G) return;
  const now = performance.now();

    const n = 3 - Math.floor((now - tCount) / 600);
    if (n !== lastCount && n >= 1) {

function finish(ts, brim) {

  const over = err > 1e-6;

  G.results.push(res);

  const a = Math.abs(err);

  if (brim) { verdict = '철철 넘쳤습니다'; detail = '컵이 가득 차도록 멈추지 않았습니다.'; stamp = '넘침!'; bad = true; snd = 'flood'; }
  else if (over) { verdict = '선 넘었습니다'; detail = '목표선보다 ' + (a < 0.1 ? '0.1' : mm(err)) + 'mm 더 따랐습니다.'; stamp = '선 넘음!'; bad = true; snd = 'over'; }
  else {
    detail = '목표선까지 ' + mm(err) + 'mm 남겼습니다.';
    if (a < 0.5) { verdict = '딱 맞췄습니다'; stamp = '딱!'; snd = 'perfect'; }

  btnNext.textContent = lastTurn
    ? (G.r + 1 >= G.rounds ? '최종 결과 보기' : (G.r + 1) + '판 결과 보기')
    : '다음: ' + G.players[G.order[G.turn + 1]].name;

  btnStop.hidden = true;

    D.h = hFromV(dV);
    if (D.h >= D.target - 0.006) { dPh = 3; dClock = 0; D.pouring = false; D.streamOn = false; D.tiltGoal = 0; D.steamOn = true; }
  } else if (dPh === 3) {                            // 딱 멈춘 모습 보여 주기
    if (dClock > 2.2) { dPh = 4; dClock = 0; D.steamOn = false; D.drain = true; }
  } else if (D.h <= 0) { D.drain = false; dPh = 0; dClock = 0; }
}

/* ───────── 루프 ───────── */
readTokens();
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', readTokens);
}
try { new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(readTokens).catch(() => {});

const heroCv = $('hero'), cv = $('cv');
let lastT = 0;
function frame(ts) {
  const t = ts / 1000;
  const dt = clamp(t - lastT, 0, 0.05);
  lastT = t;
  if (cur === 'setup') { demoUpdate(dt); tickScene(D, dt); paint(heroCv, D, t, dt); }
  else if (cur === 'play') { gameUpdate(); tickScene(S, dt); paint(cv, S, t, dt); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
